app.dev.instant-complete=false

# PostgreSQL com variáveis individuais (mais confiável que DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.cors.allowed-origins=*

# Email (Gmail SMTP) — configure no Railway
app.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:https://medieval-game-production.up.railway.app}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
