app.dev.instant-complete=false

# PostgreSQL com variáveis individuais (mais confiável que DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de conexões — ajustado para o limite do Railway
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

app.cors.allowed-origins=*

# Email via Resend (resend.com) — não usa SMTP, evita bloqueio do Railway
app.mail.enabled=${MAIL_ENABLED:false}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:Medieval Game <onboarding@resend.dev>}
app.base-url=${APP_BASE_URL:https://medieval-game-production.up.railway.app}
