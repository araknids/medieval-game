app.dev.instant-complete=false

# PostgreSQL com variáveis individuais (mais confiável que DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de conexões — ajustado para o limite do Railway
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

app.cors.allowed-origins=*

# Email via Brevo (brevo.com) — usa HTTP API, sem bloqueio SMTP
app.mail.enabled=${MAIL_ENABLED:false}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.from-email=${BREVO_FROM_EMAIL:}
app.base-url=${APP_BASE_URL:https://medieval-game-production.up.railway.app}
