# Lore de item (ItemLoreGenerator) — itemlore.<comum|incomum|raro|épico>.<weapon|armor>.<idx>
itemlore.common.weapon.0=Uma arma funcional, sem nada de especial. Dá conta do recado nas batalhas do dia a dia.
itemlore.common.weapon.1=Forjada às pressas pelo ferreiro da vila. Não é bonita, mas corta.
itemlore.common.weapon.2=Desgastada pelo uso, mas ainda afiada o bastante para a luta.
itemlore.common.armor.0=Proteção básica — simples, porém funcional. Já viu dias melhores.
itemlore.common.armor.1=Costurada por mãos habilidosas, mas com materiais modestos.
itemlore.common.armor.2=Resistente o suficiente para sobreviver às primeiras batalhas de um novato.
itemlore.uncommon.weapon.0=Forjada por um artesão habilidoso que aprendeu o ofício com um mestre. Já viu muitas batalhas.
itemlore.uncommon.weapon.1=Tem o equilíbrio perfeito entre ataque e durabilidade. Não é obra de amador.
itemlore.uncommon.weapon.2=Dizem que pertenceu a um soldado da guarda que a perdeu numa escaramuça nas estradas.
itemlore.uncommon.armor.0=Construída com cuidado e materiais de qualidade superior. Oferece proteção de verdade.
itemlore.uncommon.armor.1=Equipamento digno de um soldado veterano. Sobreviveu a muitas batalhas.
itemlore.uncommon.armor.2=Feita com técnica refinada. Quem a usou antes sabia o que fazia.
itemlore.rare.weapon.0=Dizem que esta arma pertenceu a um guerreiro lendário que sumiu misteriosamente nas Terras do Norte.
itemlore.rare.weapon.1=Emite um brilho tênue ao luar. Forjada com metais raros de uma mina hoje abandonada.
itemlore.rare.weapon.2=Gravuras antigas decoram sua lâmina. Ninguém sabe ao certo o que significam.
itemlore.rare.armor.0=Feita com técnicas antigas quase esquecidas. Emana uma aura de poder contido.
itemlore.rare.armor.1=As marcas de batalha nela são incontáveis. Sobreviveu onde outras pereceram.
itemlore.rare.armor.2=Criada por um armeiro de reputação lendária. Vale muito mais do que aparenta.
itemlore.epic.weapon.0=Um artefato de poder incomensurável. Dizem que foi banhado no sangue de um dragão ancião.
itemlore.epic.weapon.1=O nome desta arma ecoa pelos séculos. Guerreiros caíam de joelhos só de vê-la.
itemlore.epic.weapon.2=Criada numa forja esquecida pelos deuses, guarda em si um fragmento de batalhas épicas.
itemlore.epic.armor.0=Criada pelos próprios forjadores dos deuses, carrega a bênção dos guerreiros antigos.
itemlore.epic.armor.1=Só os mais dignos são considerados merecedores de vesti-la.
itemlore.epic.armor.2=Nenhum ferreiro vivo consegue reproduzir esta obra. É uma relíquia de outra era.

