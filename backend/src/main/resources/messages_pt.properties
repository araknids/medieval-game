ability.TOUGHNESS.desc=+12 de HP máx por nível.
ability.WEAPON_MASTERY.name=Maestria com Armas
ability.WEAPON_MASTERY.desc=+2 ATK por nível.
ability.SHIELD_BASH.name=Pancada de Escudo
ability.SHIELD_BASH.desc=A cada 5 rounds: +(8+4×nv) de dano bônus.
ability.SECOND_WIND.name=Fôlego Renovado
ability.SECOND_WIND.desc=Uma vez por luta, abaixo de 30% de HP: cura (10+3×nv)% do HP máx.
ability.BERSERK.name=Fúria
ability.BERSERK.desc=Abaixo de 50% de HP: +(5×nv)% de ATK por 3 rounds (CD 8).
ability.EAGLE_EYE.name=Olho de Águia
ability.EAGLE_EYE.desc=+2 LUK por nível (janela de crítico + Resguardo da Sorte).
ability.AGILITY.name=Agilidade
ability.AGILITY.desc=+1 AGI por nível (golpes extras + esquiva).
ability.PRECISE_SHOT.name=Tiro Preciso
ability.PRECISE_SHOT.desc=A cada 4 rounds: crítico garantido + (3×nv) de dano bônus.
ability.VOLLEY.name=Saraivada
ability.VOLLEY.desc=A cada 5 rounds: ataque extra a (50+5×nv)% do dano.
ability.EVASIVE_ROLL.name=Rolamento Evasivo
ability.EVASIVE_ROLL.desc=A cada 6 rounds: esquiva do próximo golpe + reflete (2×nv) de dano.
ability.HAGGLER.name=Pechinchador
ability.HAGGLER.desc=📦 +2 LUK/nv e +3% no preço de venda por nível.
ability.TREASURE_HUNTER.name=Caçador de Tesouros
ability.TREASURE_HUNTER.desc=📦 +2% de chance de drop de item por nível.
ability.MASTER_CRAFTSMAN.name=Mestre Artesão
ability.MASTER_CRAFTSMAN.desc=📦 +3% de sucesso de craft/nv · +2.5% de stats/nv em equipamento que você mesmo forjou.
ability.PROSPECTOR.name=Prospector
ability.PROSPECTOR.desc=📦 +5% de rendimento de coleta por nível.
ability.CRUSHING_BLOW.name=Golpe Esmagador
ability.CRUSHING_BLOW.desc=A cada 5 rounds: +(8+4×nv) de dano bônus.

