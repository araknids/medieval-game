# ── Path Trial — lore por caminho (P1 piloto) ──
class.trial.WARRIOR.intro=Você sobe ao campo de provas acima da cidade, onde o Guardião da Lâmina espera — um veterano marcado por cicatrizes, jurado a testar quem pretende trilhar o caminho do guerreiro. Ele saca a espada sem dizer palavra. "Mostre que sabe aguentar um golpe e devolver," ele diz. "A lâmina não perdoa nada."
class.trial.WARRIOR.victory=Aço ressoou contra aço até o Guardião baixar a lâmina e curvar a cabeça. Você lutou como uma fera solta — lendo cada golpe, trocando dano por dano sem recuar. "Você tem o ferro pra isso," ele diz. Agora você é um Guerreiro. A linha de frente é sua para segurar.
class.trial.WARRIOR.defeat=A lâmina do Guardião achou cada brecha na sua guarda, e o mundo escureceu. Você acorda dolorido sobre as pedras do campo de provas. "Volte quando seu corpo lembrar da lição," ele diz, embainhando a espada.

class.trial.ARCHER.intro=Você segue a trilha dos caçadores até uma crista varrida pelo vento, onde a Guardiã do Arco está de corda já retesada. Ela não cumprimenta — apenas solta uma flecha que rasga o ar rente à sua orelha. "Paciência e olhar firme, ou nada feito," ela chama. "Vamos ver qual é o seu caso."
class.trial.ARCHER.victory=Você dançou na borda do alcance dela, soltando flechas entre as rajadas até a aljava dela secar e a sua não. Ela baixa o arco com a sombra de um sorriso. "Você lê o vento. Bom." Agora você é um Arqueiro. Acerte de longe, e nunca os deixe chegar perto.
class.trial.ARCHER.defeat=As flechas dela te prenderam antes de você achar o ritmo, e você caiu com a corda vazia na mão. "Pés e paciência," ela diz, recolhendo as flechas. "Volte quando tiver aprendido os dois."

class.trial.MERCHANT.intro=Você encontra o Guardião da Caravana no pátio de comércio, contando moedas sobre um caixote, um machado pesado descansando sobre os joelhos. "Todo mundo quer as riquezas da estrada," ele diz sem erguer os olhos, "mas a estrada morde de volta." Ele se levanta, erguendo o machado. "Prove que sabe guardar a própria bolsa."
class.trial.MERCHANT.victory=Golpe por golpe você o acompanhou, machado contra machado, até ele erguer a mão aberta e rir. "Você serve. Moeda não vale nada pra um defunto — e você pretende viver." Agora você é um Mercador. Que seu comércio e seu ofício te deixem mais rico que qualquer lâmina.
class.trial.MERCHANT.defeat=Ele virou seus próprios golpes contra você e te deixou estendido ao lado dos caixotes. "Só força não toma conta de uma caravana," ele diz, jogando uma única moeda pra você. "Volte mais afiado."
