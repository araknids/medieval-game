class.RECRUIT.name=Recruta
class.WARRIOR.name=Guerreiro
class.ARCHER.name=Arqueiro
class.MERCHANT.name=Mercador
class.WARRIOR.desc=Tanque da linha de frente. STR e CON, muito HP e armadura — depende de mitigação bruta, não de esquiva.
class.ARCHER.desc=Canhão de vidro. DEX e LUK — alta esquiva e críticos frequentes, mas frágil quando é atingido.
class.MERCHANT.desc=Classe de economia (machado e marreta). Um pouco mais fraco na luta, mas suas habilidades aumentam loot, criação e comércio — cresce em bola de neve pela riqueza.

