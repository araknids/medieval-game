# Lido como UTF-8 (I18nConfig.defaultEncoding). Chaves sem args → apóstrofo simples ok.

# ── Path Trial — lore por caminho (P1 piloto) ──
class.trial.WARRIOR.intro=Você sobe ao campo de provas acima da cidade, onde o Guardião da Lâmina espera — um veterano marcado por cicatrizes, jurado a testar quem pretende trilhar o caminho do guerreiro. Ele saca a espada sem dizer palavra. "Mostre que sabe aguentar um golpe e devolver," ele diz. "A lâmina não perdoa nada."
class.trial.WARRIOR.victory=Aço ressoou contra aço até o Guardião baixar a lâmina e curvar a cabeça. Você lutou como uma fera solta — lendo cada golpe, trocando dano por dano sem recuar. "Você tem o ferro pra isso," ele diz. Agora você é um Guerreiro. A linha de frente é sua para segurar.
class.trial.WARRIOR.defeat=A lâmina do Guardião achou cada brecha na sua guarda, e o mundo escureceu. Você acorda dolorido sobre as pedras do campo de provas. "Volte quando seu corpo lembrar da lição," ele diz, embainhando a espada.

class.trial.ARCHER.intro=Você segue a trilha dos caçadores até uma crista varrida pelo vento, onde a Guardiã do Arco está de corda já retesada. Ela não cumprimenta — apenas solta uma flecha que rasga o ar rente à sua orelha. "Paciência e olhar firme, ou nada feito," ela chama. "Vamos ver qual é o seu caso."
class.trial.ARCHER.victory=Você dançou na borda do alcance dela, soltando flechas entre as rajadas até a aljava dela secar e a sua não. Ela baixa o arco com a sombra de um sorriso. "Você lê o vento. Bom." Agora você é um Arqueiro. Acerte de longe, e nunca os deixe chegar perto.
class.trial.ARCHER.defeat=As flechas dela te prenderam antes de você achar o ritmo, e você caiu com a corda vazia na mão. "Pés e paciência," ela diz, recolhendo as flechas. "Volte quando tiver aprendido os dois."

class.trial.MERCHANT.intro=Você encontra o Guardião da Caravana no pátio de comércio, contando moedas sobre um caixote, um machado pesado descansando sobre os joelhos. "Todo mundo quer as riquezas da estrada," ele diz sem erguer os olhos, "mas a estrada morde de volta." Ele se levanta, erguendo o machado. "Prove que sabe guardar a própria bolsa."
class.trial.MERCHANT.victory=Golpe por golpe você o acompanhou, machado contra machado, até ele erguer a mão aberta e rir. "Você serve. Moeda não vale nada pra um defunto — e você pretende viver." Agora você é um Mercador. Que seu comércio e seu ofício te deixem mais rico que qualquer lâmina.
class.trial.MERCHANT.defeat=Ele virou seus próprios golpes contra você e te deixou estendido ao lado dos caixotes. "Só força não toma conta de uma caravana," ele diz, jogando uma única moeda pra você. "Volte mais afiado."

# ══════════════════════════════════════════════════════════════════════════════
# P2 — Quests (nome+flavor do KingdomQuestType; diálogo/opções/desfechos do InteractiveQuests)
# EN = a prosa do catálogo (default do getOr); aqui só o PT. Keys: quest.<QT>.* / questdlg.<QT>.*
# ══════════════════════════════════════════════════════════════════════════════
quest.PATROL_COAST.name=Águas Generosas
quest.PATROL_COAST.flavor=As redes sobem cheias antes mesmo de você lançá-las. O mar quer você bem alimentado — e quer que você fique.
quest.EXPLORE_REEFS.name=O Recife que Cresceu
quest.EXPLORE_REEFS.flavor=Este recife não estava nas cartas do ano passado. Está mais perto da costa agora. Estará ainda mais perto na próxima estação.
quest.SALVAGE_THE_WRECK.name=O que a Maré Reúne
quest.SALVAGE_THE_WRECK.flavor=Todos os naufrágios desta costa derivaram para a mesma enseada, as proas todas apontando na mesma direção — para dentro, e para baixo.
quest.CLEAR_PIRATE_COVE.name=Os Mortos que Se Esticam
quest.CLEAR_PIRATE_COVE.flavor=Os piratas não se afogaram fugindo das feras. Morreram se esticando para as profundezas, mãos estendidas para a água, como se tivessem sido chamados.
quest.DEEP_SEA_RAID.name=Fundo Demais
quest.DEEP_SEA_RAID.flavor=Quanto mais fundo você mergulha, mais quente fica a água. Um mar frio não deveria ter um coração quente batendo em algum lugar lá embaixo.
quest.HUNT_SEA_MONSTER.name=O Homem que o Mar Devolveu
quest.HUNT_SEA_MONSTER.flavor=Os mais velhos falam de um pescador perdido anos atrás, dado como morto — até que a maré o deitou na areia, respirando, mudado. Ele caminhou terra adentro e nunca mais parou. O mar não guarda nada que pretende usar.
quest.ESCORT_MINERS.name=Mais Fundo
quest.ESCORT_MINERS.flavor=A cada estação eles afundam o poço mais embaixo, e a cada estação o minério é mais rico por isso. Ninguém se pergunta onde aquilo termina.
quest.CLEAR_CAVES.name=O Zumbido
quest.CLEAR_CAVES.flavor=As galerias mais baixas zumbem — grave e constante, quase um batimento cardíaco. Os veteranos juram que pararam de ouvi-lo anos atrás.
quest.SHORE_UP_TUNNELS.name=As Paredes Quentes
quest.SHORE_UP_TUNNELS.flavor=As paredes aqui embaixo são quentes ao toque, e cedem um pouco quando você as escora — como se preferissem não ser sustentadas.
quest.RETRIEVE_LOST_ORE.name=A Veia Sangrenta
quest.RETRIEVE_LOST_ORE.flavor=Onde a picareta morde, o minério escorre vermelho e úmido antes de secar — como se a montanha sangrasse onde você a fere.
quest.PURGE_INFESTATION.name=O que Cresce Lá Embaixo
quest.PURGE_INFESTATION.flavor=As coisas no poço mais fundo não vagaram para dentro. Elas cresceram ali, das paredes, vestindo a forma da rocha.
quest.DEFEAT_CAVE_BEAST.name=O que Se Agita na Pedra
quest.DEFEAT_CAVE_BEAST.flavor=No fim da veia a parede é lisa — não é rocha. Cede quando você a pressiona. O minério aqui não se solta; ele chora.
quest.DEFEND_WALLS.name=O Lado Errado
quest.DEFEND_WALLS.flavor=Os monstros não sitiam a fortaleza. Eles jorram dela — do portão que dá para a torre do Rei.
quest.CLEAR_DUNGEON.name=Aqueles que Ficaram
quest.CLEAR_DUNGEON.flavor=Os prisioneiros na masmorra são a antiga guarnição. Eles não desertaram — foram mudados onde estavam, cada rosto voltado para a Torre.
quest.PATROL_RAMPARTS.name=À Sombra da Torre
quest.PATROL_RAMPARTS.flavor=Das muralhas você consegue ver: nenhuma luz na torre do Rei há muito, muito tempo — só um brilho fraco vindo do andar mais baixo, da tonalidade errada de pálido.
quest.RAID_ENCAMPMENT.name=Os Fiéis
quest.RAID_ENCAMPMENT.flavor=Não é um exército inimigo acampado aos portões. São peregrinos e soldados que caminharam até a Torre e se ajoelharam. Eles não deixarão você passar até ela.
quest.BREACH_THE_KEEP.name=A Última Porta
quest.BREACH_THE_KEEP.flavor=O senhor da torre de menagem a selou por dentro, dizem, "para manter algo lá dentro". Seja o que for, mesmo assim ela escorre por baixo da porta.
quest.HUNT_WARLORD.name=O Cavaleiro Amaldiçoado
quest.HUNT_WARLORD.flavor=O mais forte dos caídos foi o próprio campeão do Rei, posto a guardar a Torre. Ele não luta para vencer você — luta para mantê-lo FORA.
quest.GUARD_CRYSTAL_VEINS.name=O que as Gemas Sonham
quest.GUARD_CRYSTAL_VEINS.flavor=Os cristais voltam a crescer durante a noite, exatamente nas mesmas formas, como se algo lá embaixo continuasse a sonhá-los.
quest.MAP_THE_GROTTO.name=Mapeando o que Se Move
quest.MAP_THE_GROTTO.flavor=A gruta nunca é a mesma duas vezes. Os túneis se reorganizam quando ninguém está olhando — sempre conduzindo mais para baixo.
quest.EXTRACT_GEODES.name=Sangue Cristalizado
quest.EXTRACT_GEODES.flavor=Quebre um geodo fresco e o interior é vermelho e viscoso antes de endurecer. As gemas são sangue, capturado e endurecido no escuro.
quest.SEAL_THE_FISSURE.name=A Fenda que Respira
quest.SEAL_THE_FISSURE.flavor=Nenhuma corrente fria sai da fenda. Ar quente entra, sopro após sopro lento, como se a caverna o estivesse puxando para baixo.
quest.CLEANSE_CRYSTAL_HORROR.name=Os que Escutaram
quest.CLEANSE_CRYSTAL_HORROR.flavor=Os garimpeiros aqui largaram as ferramentas e se ajoelharam, repetindo uma palavra que ninguém lhes ensinou. O cristal lhes deu uma voz, e um mestre a quem obedecer.
quest.SLAY_CRYSTAL_BEAST.name=A Voz na Pedra
quest.SLAY_CRYSTAL_BEAST.flavor=Ela não ruge. Ela fala — o seu nome, as coisas que você deseja — e por um sopro você quer baixar a lâmina e simplesmente escutar.
quest.CLEANSE_THE_TIDES.name=A Maré que Não Fica Limpa
quest.CLEANSE_THE_TIDES.flavor=Você limpa a podridão, e pela manhã a maré já deitou mais — gentilmente, pacientemente, como se tivesse todo o tempo do mundo.
quest.BLESS_THE_SHALLOWS.name=Já Abençoada
quest.BLESS_THE_SHALLOWS.flavor=Os sacerdotes abençoam a água. A água já estava mais luminosa do que qualquer oração que eles conheçam.
quest.ESCORT_PILGRIMS.name=Os Peregrinos
quest.ESCORT_PILGRIMS.flavor=Eles vêm de toda costa para beber da maré curativa. Nenhum deles pergunta por que um mar morto iria querer mantê-los vivos.
quest.PURIFY_THE_REEF.name=O Recife Pálido
quest.PURIFY_THE_REEF.flavor=O coral aqui tem a cor errada — pálido, e quente, e ele incha e baixa, lento, como algo respirando enquanto dorme.
quest.BANISH_THE_DROWNED.name=Os Afogados
quest.BANISH_THE_DROWNED.flavor=Eles não vêm para matar. Passam por você, mãos estendidas para a rebentação, querendo voltar às profundezas. Você os abate, e eles parecem agradecer.
quest.GUARD_SACRED_REEF.name=Abaixo do Recife Sagrado
quest.GUARD_SACRED_REEF.flavor=Sob a água mais sagrada a luz vem de baixo, não de cima. Os peixes se reúnem ali, imóveis como vidro, todos eles voltados para baixo.
quest.RESCUE_STRAY_DOG.name=Uma Vira-Lata em Apuros
quest.RESCUE_STRAY_DOG.flavor=Uma cadela semiafogada treme sobre as pedras. A maré insiste em tentar levá-la de volta. Você não permite.
questdlg.RESCUE_STRAY_DOG.intro=Uma cadela vira-lata trêmula está deitada na lama, doente e ganindo. Ela ergue os olhos para você, cansados e esperançosos.
questdlg.RESCUE_STRAY_DOG.opt.help.label=Ajudar a cadela
questdlg.RESCUE_STRAY_DOG.opt.help.hint=sem recompensa — mas talvez uma amiga leal
questdlg.RESCUE_STRAY_DOG.out.help.text=Você cuida dela.
questdlg.RESCUE_STRAY_DOG.opt.leave.label=Seguir em frente
questdlg.RESCUE_STRAY_DOG.out.leave.text=Você a deixa em paz.
questdlg.PATROL_COAST.intro=Contrabandistas estão descarregando caixotes na praia enevoada.
questdlg.PATROL_COAST.opt.hail.label=Saudá-los abertamente
questdlg.PATROL_COAST.out.hail.text=Eles lhe enfiam um suborno e você dá as costas sem perguntar nada. Só na volta para casa percebe que cada caixote trazia o mesmo selo manchado de sal — o que a maré deixa naquilo que já reivindicou.
questdlg.PATROL_COAST.opt.ambush.label=Emboscar os contrabandistas
questdlg.PATROL_COAST.out.ambush.win=Você desbarata o bando e toma a carga antes que possam fugir. Só depois, ao forçar as tampas, descobre o selo crostado de sal estampado em cada caixote — a marca que a maré deixa na carga que já prometeu a si mesma.
questdlg.PATROL_COAST.out.ambush.lose=Eles estavam à sua espera, e as lâminas vêm mais rápido que os subornos. Você manca para dentro da névoa de mãos vazias, e a rebentação às suas costas mantém um ritmo grave e paciente, como se tivesse apostado nisto o tempo todo.
questdlg.PATROL_COAST.opt.tally.label=Infiltrar-se e contar a carga
questdlg.PATROL_COAST.opt.tally.hint=DEX 10
questdlg.PATROL_COAST.out.tally.ok.text=Você conta cada caixote sem ser visto e vende a contagem a quem paga por ela. Seus compradores nunca explicam por que todos os manifestos de carga terminam no mesmo trecho de água negra — e você aprendeu a não perguntar.
questdlg.PATROL_COAST.out.tally.fail.win=Uma tábua range sob seus pés, e eles se viram com o aço já desembainhado — mas você abre caminho cortando para fora do círculo. A luta deixa você sem fôlego na praia, e a linha-d'água subiu até suas botas enquanto você estava de costas, mais alto do que qualquer maré deveria chegar.
questdlg.PATROL_COAST.out.tally.fail.lose=Pego de surpresa em meio aos caixotes, você apara os golpes deles só o tempo justo para fugir para o escuro. Você dá à praia mais longe na costa do que seus pés poderiam tê-lo levado, e o mar frio não diz como você chegou lá.
questdlg.EXPLORE_REEFS.intro=Luzes estranhas pulsam sob o recife.
questdlg.EXPLORE_REEFS.opt.mark.label=Marcar o local e partir
questdlg.EXPLORE_REEFS.out.mark.text=Você registra as luzes no mapa e volta para reportar sem molhar uma bota. Naquela noite o mesmo brilho desabrocha em seus sonhos, paciente e subindo, como se as profundezas tivessem decorado o seu rosto em troca.
questdlg.EXPLORE_REEFS.opt.dive.label=Mergulhar na água escura
questdlg.EXPLORE_REEFS.out.dive.win=Uma enguia à espreita surge do lodo e ataca — e você a abre da guelra à cauda. Enquanto ela afunda, junta-se às formas pálidas que já esperam no fundo, e você percebe que a luz nunca foi a enguia, mas algo mais fundo que a usa de isca.
questdlg.EXPLORE_REEFS.out.dive.lose=Uma enguia à espreita o pega de surpresa, e o escuro frio se fecha sobre sua cabeça antes que você possa se livrar. Você rompe a superfície ofegando bem longe de onde mergulhou, as profundezas o soltando desta vez — não o libertando, só decidindo que ainda não é a hora.
questdlg.EXPLORE_REEFS.opt.read.label=Ler as correntes
questdlg.EXPLORE_REEFS.opt.read.hint=DEX 10
questdlg.EXPLORE_REEFS.out.read.ok.text=Você traça os canais seguros e ergue o tesouro afundado das águas. As mãos afogadas que o seguravam soltaram fácil demais — como se o mar estivesse emprestando, não entregando, e pretendesse ser pago de volta.
questdlg.EXPLORE_REEFS.out.read.fail.win=Uma corrente de retorno o arrasta de lado para a toca da enguia, e você corta caminho para fora através de dentes e correnteza. Você rasteja para cima do recife espremido e tremendo, certo agora de que o canal não o traiu por acaso — a água o guiou até ali.
questdlg.EXPLORE_REEFS.out.read.fail.lose=Uma corrente de retorno o arrasta para baixo antes que você possa ler sua curva, e o recife se fecha à sua volta como um punho. Você desperta meio enterrado nos baixios de mãos vazias e a memória cheia de frio, o mar tendo cobrado seu preço e o deixado para contá-lo.
questdlg.SALVAGE_THE_WRECK.intro=Um galeão meio afundado geme sobre as rochas, com o porão ainda cheio.
questdlg.SALVAGE_THE_WRECK.opt.float.label=Pegar o que flutua solto
questdlg.SALVAGE_THE_WRECK.out.float.text=Você junta a carga à deriva sem nem um respingo. Os caixotes que ficaram lá embaixo não afundaram — foram puxados, e o que os puxou observou você levar o resto.
questdlg.SALVAGE_THE_WRECK.opt.pry.label=Arrombar o porão
questdlg.SALVAGE_THE_WRECK.out.pry.win=Saqueadores presos avançam do escuro alagado, e você os abate um a um até o porão ser seu. Eles não vasculhavam o destroço, mas o guardavam, e morreram virados para dentro, para a água mais funda do casco.
questdlg.SALVAGE_THE_WRECK.out.pry.lose=Os saqueadores se aglomeram em número maior do que você calculou, e o mar jorra pela brecha para reforçá-los. Você cambaleia para fora enquanto o porão se enche às suas costas, o frio subindo em seus calcanhares com a certeza tranquila de algo que sabe que você não pode fugir para sempre.
questdlg.SALVAGE_THE_WRECK.opt.brace.label=Escorar o casco e revistar
questdlg.SALVAGE_THE_WRECK.opt.brace.hint=STR 14
questdlg.SALVAGE_THE_WRECK.out.brace.ok.text=Você escora o casco que cede sobre os ombros e esvazia o porão por completo. As tábuas estremecem contra você o tempo todo, lentas e deliberadas, como algo lá embaixo testando quanto peso você aguenta antes de o mar decidir ficar com você também.
questdlg.SALVAGE_THE_WRECK.out.brace.fail.win=O casco cede sob seu ombro, e os saqueadores se derramam com ele — você os derruba no escuro que jorra e se arranca para fora. O galeão afunda mais fundo enquanto você sai, gemendo como se invejasse a fuga que quase lhe negou.
questdlg.SALVAGE_THE_WRECK.out.brace.fail.lose=O destroço se desloca enquanto você se esforça contra ele e o prende às tábuas enquanto a água sobe pelo seu peito. Você se solta no último instante e emerge sem nada além da vida, e a carcaça meio afundada parece observar sua fuga, sem pressa, certa da próxima vez.
questdlg.CLEAR_PIRATE_COVE.intro=A enseada fede a rum e pólvora — piratas, e muitos deles.
questdlg.CLEAR_PIRATE_COVE.opt.toll.label=Negociar um pedágio
questdlg.CLEAR_PIRATE_COVE.out.toll.text=O dinheiro troca de mãos e os piratas o deixam passar, sorrindo. Eles não têm medo de você, e na saída você entende por quê: homens que vivem nesta costa aprendem que há senhores muito piores do que outros homens, e todos eles moram debaixo d'água.
questdlg.CLEAR_PIRATE_COVE.opt.storm.label=Invadir a enseada
questdlg.CLEAR_PIRATE_COVE.out.storm.win=Você dispersa a tripulação pela areia e reclama a enseada fétida para si. Os sobreviventes não fogem para o interior, mas entram na rebentação para sumir, escolhendo a água escura em vez do seu aço, como se ela fosse o senhor mais brando afinal.
questdlg.CLEAR_PIRATE_COVE.out.storm.lose=Em desvantagem de três para um, você cede terreno até a rebentação estar às suas costas e então rompe por ela em meio à espuma. Os piratas não levam a perseguição até a linha-d'água — aprenderam a não fazê-lo, e o motivo lambe frio em volta dos seus joelhos enquanto você se afasta pela água.
questdlg.CLEAR_PIRATE_COVE.opt.lines.label=Cortar suas amarras
questdlg.CLEAR_PIRATE_COVE.opt.lines.hint=DEX 14
questdlg.CLEAR_PIRATE_COVE.out.lines.ok.win=Com seus navios arrastados pela maré, os piratas entram em pânico, e você cai sobre eles enquanto choram pelos cascos à deriva. A enseada é sua ao anoitecer, mas os navios soltos não encalham nas rochas como deveriam — deslizam para fora e para baixo, levados inteiros e quietos.
questdlg.CLEAR_PIRATE_COVE.out.lines.ok.lose=Eles se reúnem mais rápido do que o caos deveria permitir, cerrando fileiras antes que você possa explorar a vantagem, e o peso deles o empurra de volta. Você rompe ferido para os baixios, a enseada ainda deles, o mar ainda à escuta.
questdlg.CLEAR_PIRATE_COVE.out.lines.fail.win=Um vigia o marca no meio do corte e a enseada irrompe, mas você troca as cordas pela lâmina e abre espaço para respirar. Você escapa com o saque pela metade, e as amarras soltas se arrastam para a água negra que as engole sem um respingo.
questdlg.CLEAR_PIRATE_COVE.out.lines.fail.lose=Pego com a faca nas cordas e nenhuma mão livre para a espada, você é repelido pela areia antes de se recuperar. Você cambaleia para a rebentação para despistá-los, e o frio se fecha à sua volta quase com carinho, como se tivesse guardado o seu lugar.
questdlg.DEEP_SEA_RAID.intro=Uma frota saqueadora ancora ao largo da garganta, atacando ao amanhecer.
questdlg.DEEP_SEA_RAID.opt.hold.label=Dar o alarme e resistir
questdlg.DEEP_SEA_RAID.out.hold.win=Você dá o alarme e segura a praia de cascalho até os saqueadores se quebrarem na sua linha e recuarem para os navios. Vendo-os remar para fora, percebe que nenhum dos mortos que deixam permanece na areia — a maré que recua os recolhe e os leva, asseada como um anfitrião que tira a mesa.
questdlg.DEEP_SEA_RAID.out.hold.lose=A linha cede onde os saqueadores pressionam mais forte, e você recua sobre seus próprios feridos enquanto a praia é perdida. Você se arrasta para fora da luta ferido e exausto, a névoa da garganta rolando para esconder tanto o inimigo quanto a coisa fria que o mar faz dos tombados.
questdlg.DEEP_SEA_RAID.opt.sink.label=Afundar a nau capitânia à noite
questdlg.DEEP_SEA_RAID.opt.sink.hint=DEX 18
questdlg.DEEP_SEA_RAID.out.sink.ok.text=Você abre o ventre da nau capitânia ao mar e a frota em pânico se dispersa antes do amanhecer. Os saqueadores que se afogam não se debatem por muito tempo — a água os leva para baixo com suavidade, quase ternura, do jeito que leva tudo aquilo que esperou.
questdlg.DEEP_SEA_RAID.out.sink.fail.win=Um sino de alarme rasga a noite e o convés se enche de saqueadores, mas você abre caminho até a amurada e se atira na água negra. Você nada rumo à praia através de um mar que parece empurrar e puxar ao mesmo tempo, e alcança as rochas meio afogado, mas respirando.
questdlg.DEEP_SEA_RAID.out.sink.fail.lose=O sino de alarme toca antes de seu trabalho terminar, e os saqueadores o expulsam do convés para o frio. Você é arrancado da água mais adiante na costa, os pulmões cheios de água salgada e mal vivo, sem memória das mãos que o soltaram.
questdlg.HUNT_SEA_MONSTER.intro=O leviatã emerge, as mandíbulas largas o bastante para engolir um barco.
questdlg.HUNT_SEA_MONSTER.opt.face.label=Enfrentá-lo de frente
questdlg.HUNT_SEA_MONSTER.out.face.win=Você sobe na crista da onda por baixo de sua mandíbula e crava a lâmina limpa através do seu olho, e a grande massa estremece e afunda. A carcaça não boia como deveria — desliza direto para baixo no escuro, levada para onde quer que tais coisas sejam guardadas.
questdlg.HUNT_SEA_MONSTER.out.face.lose=As mandíbulas se fecham a um palmo de você e a onda de choque o arremessa contra as rochas, quebrando-o na pedra. Você desperta quebrado e sangrando na praia, o leviatã de volta às profundezas, a maré já fuçando seus calcanhares para ver se vai ficar com você.
questdlg.HUNT_SEA_MONSTER.opt.lure.label=Atraí-lo para os baixios
questdlg.HUNT_SEA_MONSTER.opt.lure.hint=LUCK 18
questdlg.HUNT_SEA_MONSTER.out.lure.ok.win=Ele persegue seu barco até os baixios e encalha debatendo-se na água rasa, onde você o termina a seu bel-prazer. Mesmo encalhado e morrendo ele se esforça rumo às profundezas, a cabeça virada para o mar aberto, como se algo lá fora o chamasse para casa.
questdlg.HUNT_SEA_MONSTER.out.lure.ok.lose=Ele se ergue do banco de areia antes que você possa golpear e se volta contra você num turbilhão de fúria, espalhando seu plano na espuma. Você esvazia o barco e rema pela vida, e a garganta engole sua jogada inteira — barco, carga e coragem — poupando só você, e a contragosto.
questdlg.HUNT_SEA_MONSTER.out.lure.fail.win=Ele recusa a isca e o encontra em águas profundas, mas você finca uma lâmina em seu couro e cavalga a raiva dele até cansar e mergulhar. Você deriva para casa exaurido e vitorioso, inquietamente ciente de que as profundezas o deixaram ficar com esta presa.
questdlg.HUNT_SEA_MONSTER.out.lure.fail.lose=Ele não se deixa conduzir e o encontra onde a água não tem fundo — sua jogada se afoga no instante em que começa. Você é arrastado para baixo e cuspido de volta por uma corrente de retorno que não sabe explicar, dando à praia sem nada, certo de que o mar simplesmente não havia terminado com você.
questdlg.ESCORT_MINERS.intro=Os mineiros se recusam a entrar — juram que algo se moveu no escuro.
questdlg.ESCORT_MINERS.opt.walk.label=Conduzi-los para dentro, tochas no alto
questdlg.ESCORT_MINERS.out.walk.text=Tochas no alto, você conduz os mineiros para dentro e o escuro permanece vazio o suficiente para se trabalhar. Mas a parede de rocha sob sua palma está morna, levemente, como um flanco que sobe e desce — e os mineiros a escavam mesmo assim, porque o minério paga e eles já pararam de se permitir reparar nisso.
questdlg.ESCORT_MINERS.opt.hunt.label=Caçar o que quer que esteja lá embaixo
questdlg.ESCORT_MINERS.out.hunt.win=Você a rastreia por uma galeria lateral gotejante e a encurrala contra a rocha, dando-lhe fim com três golpes duros. Onde ela cai a pedra está morna e levemente úmida, e a mancha escura que deixa se espalha devagar, como se a própria parede chorasse a morte.
questdlg.ESCORT_MINERS.out.hunt.lose=Ela cai sobre você de uma galeria lateral que você nunca marcou e o empurra ladeira acima, golpe a golpe, até você alcançar a luz. Você cambaleia para fora de mãos vazias, e atrás de você os túneis fundos parecem se acomodar e suspirar, do jeito que um corpo faz quando a febre passa.
questdlg.ESCORT_MINERS.opt.listen.label=Escutar a rocha
questdlg.ESCORT_MINERS.opt.listen.hint=LUCK 10
questdlg.ESCORT_MINERS.out.listen.ok.text=Você encosta o ouvido na pedra, ouve a coisa lenta se deslocar e conduz os mineiros bem ao largo dela. O que você ouviu não eram passos nem respiração, mas algo entre os dois — uma pulsação na rocha funda, marcando o tempo, sem pressa nenhuma.
questdlg.ESCORT_MINERS.out.listen.fail.win=Você lê a rocha errado, e a coisa que julgava embaixo cai sobre você do alto — mas você se firma e a afasta de volta para o escuro. Você conduz os mineiros abalados para a luz do dia, as mãos ainda formigando de uma pedra que parecia mais morna do que rocha alguma deveria.
questdlg.ESCORT_MINERS.out.listen.fail.lose=Você avalia mal a pulsação lenta na parede, e o escuro leva a melhor sobre você antes que entenda o erro. Os mineiros o içam pelos calcanhares para a luz, e você jura que a respiração na rocha só silenciou quando você parou de lutar contra ela.
questdlg.CLEAR_CAVES.intro=Desmoronamentos selaram um túnel — e algo está cavando de volta para fora.
questdlg.CLEAR_CAVES.opt.shore.label=Escorar e recuar
questdlg.CLEAR_CAVES.out.shore.text=Você empareda a brecha e puxa cada mineiro de volta para terreno mais seguro. Atrás da pedra nova, a escavação não para — só desacelera, e a argamassa fresca sai úmida e vermelha em suas mãos, embora ninguém tenha se ferido.
questdlg.CLEAR_CAVES.opt.dig.label=Cavar até chegar a ela
questdlg.CLEAR_CAVES.out.dig.win=Você atravessa a pedra recém-compactada e encontra a escavadora cara a cara, dando-lhe fim antes que possa cavar para longe. O sangue dela é o mesmo escorrimento escuro e lento que brota da rocha cortada ao seu redor, e você não saberia dizer, depois, por qual de vocês a parede sangrava.
questdlg.CLEAR_CAVES.out.dig.lose=Ela atravessa a barreira antes de você e irrompe no meio do grupo, pondo os mineiros em fuga e empurrando você túnel acima. Você recua para a luz de mãos vazias, a brecha às suas costas já se fechando com um som úmido de cicatrização que desabamento honesto algum jamais fez.
questdlg.CLEAR_CAVES.opt.seam.label=Achar a fissura frágil
questdlg.CLEAR_CAVES.opt.seam.hint=STR 10
questdlg.CLEAR_CAVES.out.seam.ok.text=Você acha a fissura frágil, golpeia uma vez e despenca o túnel inteiro sobre a coisa enquanto ela cava. O desabamento abafa um som que era quase um gemido — e onde a fissura se partiu, a pedra fresca escorre uma morna escuridão lenta, como se a própria mina sangrasse da ferida.
questdlg.CLEAR_CAVES.out.seam.fail.win=A fissura não se parte limpa, e a escavadora o alcança antes do teto vir abaixo — então você a enfrenta lâmina contra garra e a força de volta para o buraco. Você manca para fora com a passagem meio selada, as mãos manchadas de escuro de uma rocha que sangrou onde você golpeou.
questdlg.CLEAR_CAVES.out.seam.fail.lose=A fissura resiste firme aos seus golpes e a escavadora está sobre você, enterrando-o em escombros soltos ao fechar o último vão. Você se solta e foge sem nada, e o escuro morno e respirante o deixa ir, tão paciente com o seu fracasso quanto é com o minério.
questdlg.SHORE_UP_TUNNELS.intro=As vigas de sustentação estão lascando; o nível inteiro pode desabar.
questdlg.SHORE_UP_TUNNELS.opt.brace.label=Escorar o que puder
questdlg.SHORE_UP_TUNNELS.out.brace.text=Você encunha de volta no lugar as vigas que lascavam e dá ao nível mais uma estação de escavação. As madeiras seguram, mas cedem contra suas mãos com uma lentidão que madeira não deveria ter — como se as paredes estivessem inspirando, prendendo o fôlego, esperando você sair.
questdlg.SHORE_UP_TUNNELS.opt.clear.label=Limpar as feras que nidificam
questdlg.SHORE_UP_TUNNELS.out.clear.win=Você vai fenda por fenda com tocha e aço e queima cada coisa rastejante que havia se enraizado nas vigas lascadas. As fendas limpas choram uma umidade morna e fina quando os ninhos somem, como uma ferida lavada, e você tenta não imaginar do que se alimentavam.
questdlg.SHORE_UP_TUNNELS.out.clear.lose=O ninho é mais fundo do que as fendas deixam ver, e o enxame jorra mais rápido do que você consegue cortar, empurrando-o de volta à boca do poço. Você recua para a luz sem nada conquistado, o nível ainda gemendo às suas costas num ritmo lento e vivo que você prefere não nomear.
questdlg.SHORE_UP_TUNNELS.opt.heave.label=Içar um pilar ao seu lugar
questdlg.SHORE_UP_TUNNELS.opt.heave.hint=STR 14
questdlg.SHORE_UP_TUNNELS.out.heave.ok.text=Você ergue o pilar caído de pé e a galeria inteira se acomoda de volta ao silêncio. Suas mãos saem escorregadias de onde agarraram a pedra, e o calor dela permanece em suas palmas muito depois, como o toque de algo que ficou contente de ser firmado.
questdlg.SHORE_UP_TUNNELS.out.heave.fail.win=O pilar escapa das suas mãos e o estrondo agita as coisas que nidificam lá embaixo — mas você se firma e as repele para o escuro antes que possam se alvoroçar. Você encaixa a viga no lugar por fim, as mãos escorregadias e mornas de onde agarraram a rocha viva.
questdlg.SHORE_UP_TUNNELS.out.heave.fail.lose=O pilar gira ao cair e prende sua perna ao chão enquanto o ninho perturbado ferve à sua volta. Você se solta aos poucos e rasteja para a luz de mãos vazias, a pedra morna se agarrando ao seu sangue como se relutasse em deixar a ferida fechar.
questdlg.RETRIEVE_LOST_ORE.intro=Um vagonete de ferro negro sumiu por um poço lateral.
questdlg.RETRIEVE_LOST_ORE.opt.track.label=Rastrear o trilho do vagonete
questdlg.RETRIEVE_LOST_ORE.opt.track.hint=DEX 10
questdlg.RETRIEVE_LOST_ORE.out.track.ok.text=Você segue os sulcos do vagonete até um esconderijo oculto e traz o ferro negro de volta à luz. O minério está morno através da sacaria e fica mais pesado quanto mais você o carrega, como se algo nas profundezas não tivesse terminado de reivindicá-lo e ressentisse a perda.
questdlg.RETRIEVE_LOST_ORE.out.track.fail.win=Os sulcos o levam direto a um covil de gremlins, e você precisa lutar para sair com o vagonete a reboque. Você escapa carregando o ferro negro, cada pepita morna através do saco e mais pesada do que tem direito, como se preferisse ter ficado lá embaixo.
questdlg.RETRIEVE_LOST_ORE.out.track.fail.lose=Você perde a trilha numa bifurcação, depois perde o equilíbrio na pedra molhada, e o escuro engole tanto você quanto o vagonete. Você rasteja de volta rumo à luz sem nada, o minério perdido entregue às profundezas — que, você suspeita, é exatamente onde ele queria ir.
questdlg.RETRIEVE_LOST_ORE.opt.fight.label=Lutar contra os gremlins acumuladores
questdlg.RETRIEVE_LOST_ORE.out.fight.win=Você dispersa os gremlins chiantes do seu monte e reclama cada barra de ferro negro que haviam arrastado para baixo. Eles lutaram com mais afinco não pelas próprias vidas, mas para manter o minério no escuro, e o metal recuperado pulsa fracamente morno contra seus braços por toda a subida.
questdlg.RETRIEVE_LOST_ORE.out.fight.lose=Os pequenos miseráveis vêm em números que o escuro vive escondendo, e o derrubam dos pés e o empurram poço acima. Você recua sangrando e sem minério, o covil às suas costas se acomodando num zumbido baixo e satisfeito, a mina contente de ficar com o que arrastou para baixo.
questdlg.PURGE_INFESTATION.intro=As minas inferiores fervilham de coisas chiantes.
questdlg.PURGE_INFESTATION.opt.smoke.label=Defumá-las para fora
questdlg.PURGE_INFESTATION.out.smoke.text=Você sufoca os poços com fumaça e o enxame chiante jorra para cima e para fora da mina. Eles não se dispersam às cegas — todos escoam para o mesmo lado, ladeira abaixo e para dentro, em direção ao coração fundo da rocha, como quem volta para casa, para aquilo que os mandou.
questdlg.PURGE_INFESTATION.opt.wade.label=Avançar, lâmina à frente
questdlg.PURGE_INFESTATION.out.wade.win=Você avança até a cintura na maré chiante e abre caminho limpo cortando até o coração do enxame. Os vermes que você derruba não rastejam para longe para morrer, mas se arrastam para baixo, rumo à rocha funda, voltando para casa para sangrar onde a pedra corre morna.
questdlg.PURGE_INFESTATION.out.wade.lose=A maré de vermes se fecha sobre você mais rápido do que você consegue cortar, puxando seus braços e pernas até o chão sumir sob eles. Você se arranca e foge poço acima, o enxame escoando de volta para baixo às suas costas numa única corrente ansiosa, como se chamado.
questdlg.PURGE_INFESTATION.opt.collapse.label=Desabar o túnel do ninho
questdlg.PURGE_INFESTATION.opt.collapse.hint=STR 18
questdlg.PURGE_INFESTATION.out.collapse.ok.text=Um único golpe poderoso traz o teto abaixo e soterra o ninho inteiro num átimo. A pedra desabada se acomoda com um gemido longo e grave que sobe rolando de muito abaixo do ninho que você matou — algo imenso lá embaixo sentiu a ferida e gravou o formato da sua mão.
questdlg.PURGE_INFESTATION.out.collapse.fail.win=Sua investida contra a pedra-chave não derruba o teto, e o ninho perturbado jorra sobre você — mas você segura o estrangulamento e os açougueia conforme chegam. Você cambaleia para fora vitorioso, os ouvidos cheios de um gemido grave subindo rolando de baixo que rocha alguma a cair faria.
questdlg.PURGE_INFESTATION.out.collapse.fail.lose=A pedra-chave resiste, o ninho se esvazia sobre você, e o teto meio solto vem abaixo sobre sua retirada de uma só vez. Você se arranca dos escombros pelas pontas dos dedos e foge, a mina funda suspirando para se fechar às suas costas, contente de ficar com sua ninhada e seu rancor.
questdlg.DEFEAT_CAVE_BEAST.intro=Uma coisa colossal de pedra e presa bloqueia a veia mais profunda.
questdlg.DEFEAT_CAVE_BEAST.opt.strike.label=Abatê-la
questdlg.DEFEAT_CAVE_BEAST.out.strike.win=Você desgasta a fera golpe a golpe esmagador até que a grande massa de pedra e presa venha abaixo com estrondo no chão da caverna. Ela cai sobre a veia mais funda que guardava, e a rocha embaixo dela escurece devagar, como se algo lá embaixo bebesse o que escorre da morte.
questdlg.DEFEAT_CAVE_BEAST.out.strike.lose=Sua presa o pega nas costelas e o arremessa contra a parede, e o escuro se cala e se aperta à sua volta. Você desperta depois caído à beira da veia de mãos vazias, a fera de volta às profundezas, a pedra morna no seu rosto respirando lenta contra a sua pele.
questdlg.DEFEAT_CAVE_BEAST.opt.plates.label=Localizar as placas rachadas
questdlg.DEFEAT_CAVE_BEAST.opt.plates.hint=DEX 18
questdlg.DEFEAT_CAVE_BEAST.out.plates.ok.win=Você lê as junturas em seu couro de pedra, golpeia a placa rachada bem no centro, e a fera inteira se despedaça como rocha de pedreira. A veia mais funda jaz aberta atrás dela agora, a face recém-partida orvalhada de um morno escuro que minério honesto algum deveria chorar.
questdlg.DEFEAT_CAVE_BEAST.out.plates.ok.lose=A placa rachada era um truque — ela entra no seu golpe e o chifra, lançando-o ladeira abaixo para longe da veia. Você rasteja para fora de alcance e para fora das profundezas, deixando à fera o seu posto, o escuro se fechando paciente sobre o caminho de onde veio.
questdlg.DEFEAT_CAVE_BEAST.out.plates.fail.win=Você avalia mal o grão do seu couro e precisa trocar golpes do jeito duro e brutal — mas você a sobrevive, e ela tomba por fim sobre a veia aberta. Seus braços doem até o osso, e a rocha morna sob seus pés parece pulsar no compasso do seu próprio pulso martelante.
questdlg.DEFEAT_CAVE_BEAST.out.plates.fail.lose=Você lê o couro dela errado, e a fera pisoteia seu plano e por pouco você junto, expulsando-o quebrado da veia. Você se arrasta poço acima numa perna inútil, o escuro fundo o deixando ir sem um som, sem pressa, certo de que você voltará.
questdlg.DEFEND_WALLS.intro=Saqueadores se aglomeram no portão enquanto a trompa soa.
questdlg.DEFEND_WALLS.opt.hold.label=Defender a muralha
questdlg.DEFEND_WALLS.out.hold.win=Você enfrenta os saqueadores no parapeito e os arremessa de volta sobre a borda até o assalto se quebrar contra a pedra. Mas ao caírem eles não amaldiçoam a muralha — fixam os olhos além de você na Torre do Rei, os rostos acesos da mesma esperança doentia, como homens enfim admitidos àquilo que vieram servir.
questdlg.DEFEND_WALLS.out.hold.lose=Os saqueadores forçam uma brecha mais rápido do que você consegue tapá-la e a pressão deles o varre para fora da muralha. Você é carregado na debandada, contundido e tonto, e a última coisa que vê é o inimigo jorrando não rumo à torre de menagem, mas rumo ao brilho doentio da torre, atraído como ferro a um ímã.
questdlg.DEFEND_WALLS.opt.parley.label=Parlamentar para ganhar tempo
questdlg.DEFEND_WALLS.opt.parley.hint=LUCK 10
questdlg.DEFEND_WALLS.out.parley.ok.text=Suas palavras esticam o impasse o bastante para os reforços chegarem, e os saqueadores se dissipam de volta para os morros. No entanto, eles nem uma vez olharam para o portão que vieram arrombar — seus olhos não paravam de subir além das muralhas, para a Torre do Rei, como os fiéis se voltam para algo que já decidiram servir.
questdlg.DEFEND_WALLS.out.parley.fail.win=Eles respondem ao seu parlamento com uma investida súbita, mas você não é pego desprevenido — você saca e segura a brecha até eles se quebrarem e escoarem para longe. Eles fogem não para os morros abertos, mas para dentro e para cima, rumo à luz da torre, e você os deixa ir, enojado com a visão.
questdlg.DEFEND_WALLS.out.parley.fail.lose=A conversa fracassa no meio da frase e o portão cede, as vigas a cair e a torrente atrás delas soterrando sua resistência. Você é arrancado dos destroços pelos seus próprios homens em retirada, e através da fumaça você vê os saqueadores se ajoelharem, cada elmo curvado rumo à torre alta.
questdlg.CLEAR_DUNGEON.intro=A masmorra sob a torre ainda abriga os fantasmas da antiga guarnição.
questdlg.CLEAR_DUNGEON.opt.sweep.label=Vasculhá-la cela por cela
questdlg.CLEAR_DUNGEON.out.sweep.win=Você desce a fileira cela por cela, pondo a guarnição inquieta para descansar uma sombra agarradora de cada vez. Cada uma se acomoda virada para o mesmo lado ao se desfazer — para cima, rumo à torre de menagem acima — e você entende que nunca estiveram presas aqui embaixo, só ajoelhadas no escuro diante de algo bem mais alto.
questdlg.CLEAR_DUNGEON.out.sweep.lose=Algo mais antigo que a guarnição o encurrala numa cela sem saída, e sua tocha não é luz bastante para lutar. Você passa por ela e foge escada acima de mãos vazias, os mortos às suas costas não o perseguindo, mas se virando, como um só, para encarar a lenta corrupção que escorre da torre.
questdlg.CLEAR_DUNGEON.opt.map.label=Mapear a rota segura
questdlg.CLEAR_DUNGEON.opt.map.hint=DEX 14
questdlg.CLEAR_DUNGEON.out.map.ok.text=Você traça um caminho ao redor do pior dos mortos e escapa com o tesouro perdido debaixo do braço. Os fantasmas da guarnição nunca se mexem para detê-lo — só se ajoelham, cada elmo enferrujado curvado na mesma direção, rumo à lenta corrupção que escorre da Torre do Rei lá no alto.
questdlg.CLEAR_DUNGEON.out.map.fail.win=Uma curva errada o joga direto num nó de mortos inquietos, e você precisa abrir caminho a golpes de volta à rota marcada. Você escapa com o tesouro e a tocha, mas o frio impregnou o peso achado debaixo do seu braço de um modo que luz do dia alguma vai queimar.
questdlg.CLEAR_DUNGEON.out.map.fail.lose=O labirinto de celas engole sua tocha e então sua coragem, e os mortos fecham o vão que sua curva errada abriu. Você cambaleia para fora mais por sorte que por perícia, de mãos vazias, a guarnição afundada inteira às suas costas curvada em culto silencioso rumo ao pináculo que você não consegue ver.
questdlg.PATROL_RAMPARTS.intro=Algo escalou as muralhas durante a noite.
questdlg.PATROL_RAMPARTS.opt.patrol.label=Patrulhar e confrontá-lo
questdlg.PATROL_RAMPARTS.out.patrol.win=Você percorre a muralha noturna até flagrar a coisa em plena escalada e arrancá-la para dar-lhe fim sobre as pedras. Ela não luta tanto para escapar quanto para continuar subindo, arranhando além de você rumo à torre interna mesmo enquanto morre, faminta pela altura.
questdlg.PATROL_RAMPARTS.out.patrol.lose=Ela se desenrola de uma sombra que você já havia revistado e o põe em fuga pela muralha antes que possa firmar os pés. Você recua escada abaixo meio cego, e atrás de você ela retoma a escalada — não por cima da muralha e para longe, mas para cima, rumo à luz doentia na coroa da torre de menagem.
questdlg.PATROL_RAMPARTS.opt.track.label=Rastrear as marcas de garra
questdlg.PATROL_RAMPARTS.opt.track.hint=DEX 14
questdlg.PATROL_RAMPARTS.out.track.ok.text=Você segue as marcas de garra até um ninho imundo encravado sob as ameias e dá fim à coisa antes que ela possa guinchar. Ela morreu de frente para a torre alta, as garras ainda esticadas em direção a ela — o que escalou suas muralhas não veio saquear, mas rastejar para mais perto daquilo que chama do alto da Torre do Rei.
questdlg.PATROL_RAMPARTS.out.track.fail.win=As marcas de garra dão meia-volta sobre si mesmas e a coisa está de repente atrás de você — mas você se vira por dentro do bote dela e a termina contra as ameias. Ela morre se esforçando uma última vez rumo ao pináculo alto, e você fica um longo instante no frio, sem querer erguer os olhos para aquilo que ela queria.
questdlg.PATROL_RAMPARTS.out.track.fail.lose=Você perde a trilha no escuro, e é quando ela o encontra, atacando do alto sem aviso algum. Você mal se solta e foge da muralha, deixando o ninho por queimar, e do pátio você vê a coisa escalando adiante — para cima — rumo ao chamado da torre.
questdlg.RAID_ENCAMPMENT.intro=Um acampamento inimigo se estende abaixo das muralhas, mal vigiado.
questdlg.RAID_ENCAMPMENT.opt.charge.label=Investir contra o acampamento
questdlg.RAID_ENCAMPMENT.out.charge.win=Você acerta o acampamento a galope com fogo e aço e dispersa o bando de guerra para o escuro antes que formem uma linha. Os sobreviventes não correm para o campo aberto, mas de volta rumo à torre de menagem e sua torre, fugindo da sua lâmina para dentro da própria corrupção de onde desceram.
questdlg.RAID_ENCAMPMENT.out.charge.lose=Eles se reorganizam mais depressa do que um acampamento despertado tem direito, e o muro deles o repele pelo chão pisoteado. Você se retira ferido sem nada a mostrar, o inimigo já virando os rostos da luta para a torre alta, do jeito que os devotos se viram a um sino.
questdlg.RAID_ENCAMPMENT.opt.sentry.label=Degolar as sentinelas primeiro
questdlg.RAID_ENCAMPMENT.opt.sentry.hint=DEX 18
questdlg.RAID_ENCAMPMENT.out.sentry.ok.win=Uma a uma as sentinelas tombam sem um som, e então você está solto num acampamento adormecido, dando-lhe fim tenda por tenda. Os poucos que despertam não gritam o alarme, mas se ajoelham onde estão, os olhos erguidos além de você para a torre, como se sua lâmina fosse só a forma que a devoção deles esperava tomar.
questdlg.RAID_ENCAMPMENT.out.sentry.ok.lose=Sua faca encontra uma garganta meio fôlego tarde demais, o estertor da sentinela vira um grito, e o acampamento inteiro ferve à sua volta em armas. Você abre caminho cortando para fora e corre, a chance perdida, o bando de guerra já escoando para dentro rumo ao pináculo em vez de atrás de você.
questdlg.RAID_ENCAMPMENT.out.sentry.fail.win=Uma lâmina erra o alvo e o alarme é dado, mas você abandona a furtividade pela fúria e corta o acampamento desperto antes que possa se fechar. Você o deixa em chamas às suas costas, inquieto com quantos dos mortos tombaram de rosto erguido para a luz pálida da torre.
questdlg.RAID_ENCAMPMENT.out.sentry.fail.lose=Um corte malfeito desperta a guarda, e você é cercado e abatido antes de alcançar a primeira tenda. Você se arrasta para o escuro de mãos vazias e ouvidos zunindo, e o acampamento não persegue — já o esqueceu, ajoelhado rumo à torre como um só.
questdlg.BREACH_THE_KEEP.intro=A torre de menagem interna está trancada; o estandarte do senhor da guerra tremula no alto.
questdlg.BREACH_THE_KEEP.opt.batter.label=Derrubar o portão a aríete
questdlg.BREACH_THE_KEEP.opt.batter.hint=STR 18
questdlg.BREACH_THE_KEEP.out.batter.ok.text=O portão se lasca sob seu ombro e os defensores do senhor da guerra se dispersam em vez de encará-lo. Eles não correm para as muralhas nem para a mata — fogem para dentro e para cima, mais fundo na torre de menagem, rumo à luz doentia do alto, escolhendo a corrupção em vez do portão aberto que você acabou de abrir para eles.
questdlg.BREACH_THE_KEEP.out.batter.fail.win=O portão resiste o tempo justo para os defensores saírem em surtida ao seu redor — mas você enfrenta a investida deles de frente e a quebra, e o portão lascado é seu por fim. Eles recuam para dentro e para cima ao fugir, escolhendo o brilho doentio da torre em vez da estrada aberta às suas costas.
questdlg.BREACH_THE_KEEP.out.batter.fail.lose=O portão resiste, e o aríete improvisado se estilhaça sob seu último empuxo, o coice o jogando de bruços entre os destroços. Você é arrancado dali pela sua própria retirada, o estandarte do senhor da guerra ainda tremulando, os defensores lá dentro se curvando rumo a uma luz que nunca foi feita para olhos vivos.
questdlg.BREACH_THE_KEEP.opt.court.label=Lutar atravessando o pátio
questdlg.BREACH_THE_KEEP.out.court.win=Você abre um caminho vermelho pelo pátio aberto e alcança a porta interna da torre de menagem com os homens do senhor da guerra se quebrando à sua frente. Nenhum deles foge pelo portão às suas costas — escapulem mais fundo, rumo à torre, como se a corrupção lá em cima fosse a única segurança em que ainda confiam.
questdlg.BREACH_THE_KEEP.out.court.lose=O pátio se fecha à sua volta como um laço, os defensores jorrando de cada porta até não haver frente nem retaguarda. Você escapa por pouco e cambaleia para fora pelo caminho de onde veio sem nada conquistado, a torre de menagem engolindo seus homens para dentro do brilho da torre às suas costas.
questdlg.HUNT_WARLORD.intro=O senhor da guerra está no topo da torre, a lâmina já desembainhada.
questdlg.HUNT_WARLORD.opt.duel.label=Duelar com o senhor da guerra
questdlg.HUNT_WARLORD.out.duel.win=O aço tine contra o aço no topo da torre de menagem até que enfim você fura a guarda dele e o senhor da guerra cai aos seus pés. Ele morre com o rosto arruinado virado para a torre acima, articulando algo a ela, e você não fica para saber se ela respondeu.
questdlg.HUNT_WARLORD.out.duel.lose=A lâmina do senhor da guerra encontra você primeiro e o telhado se inclina para longe sob seus pés rumo ao negro. Você desperta caído contra a ameia, desarmado e dolorido, o senhor da guerra sumido para dentro da torre de menagem, a luz da torre pulsando acima como um coração lento e paciente.
questdlg.HUNT_WARLORD.opt.goad.label=Provocá-lo a uma investida
questdlg.HUNT_WARLORD.opt.goad.hint=LUCK 18
questdlg.HUNT_WARLORD.out.goad.ok.win=Suas provocações encontram o nervo exposto e ele avança cego de raiva, direto na lâmina que você tinha pronta. Conforme a fúria escorre dele, seus olhos derivam para cima rumo ao pináculo, quase em paz, como se só agora fosse encontrar o mestre que servia.
questdlg.HUNT_WARLORD.out.goad.ok.lose=Ele lê a provocação pelo que ela é e o faz pagar pela ofensa, seu contragolpe tão brutal que espalha seu equilíbrio e seu plano. Você interrompe o duelo e cambaleia escada abaixo derrotado, o senhor da guerra deixado de pé sob seu estandarte, o brilho da torre o aprovando acima.
questdlg.HUNT_WARLORD.out.goad.fail.win=Ele ri das suas provocações e se põe em guarda em vez de avançar, então você troca a armadilha por aço honesto e o desgasta do jeito difícil. Ele tomba por fim com o olhar subindo além de você para o pináculo alto, e o silêncio depois parece menos vitória que permissão.
questdlg.HUNT_WARLORD.out.goad.fail.lose=Sua provocação só afia a fúria dele, e um senhor da guerra afiado é mais do que você consegue conter — ele o derruba de joelhos e para fora da beira do telhado. Você se segura na escada abaixo e foge, o duelo perdido, a risada dele o perseguindo rumo ao pátio e à luz que a torre aguarda.
questdlg.GUARD_CRYSTAL_VEINS.intro=Ladrões lascam as veias luminosas à luz de lanterna.
questdlg.GUARD_CRYSTAL_VEINS.opt.drive.label=Expulsá-los
questdlg.GUARD_CRYSTAL_VEINS.out.drive.win=Você cai sobre os ladrões em suas lanternas e os dispersa tossindo para os túneis, as veias salvas atrás de você. Eles não o amaldiçoam ao fugir, só sorriem de volta por cima dos ombros, certos de algo — como se a pedra luminosa já lhes tivesse prometido que você mudaria de ideia.
questdlg.GUARD_CRYSTAL_VEINS.out.drive.lose=Eles voltam picaretas e formões contra você numa fúria, e o túnel estreito não lhe dá espaço para responder, então você recua. Enquanto vai, a luz zumbente das veias parece se inclinar atrás de você, paciente e tranquila, como uma voz que sabe ter todo o tempo de que precisa.
questdlg.GUARD_CRYSTAL_VEINS.opt.catch.label=Pegá-los em flagrante
questdlg.GUARD_CRYSTAL_VEINS.opt.catch.hint=DEX 10
questdlg.GUARD_CRYSTAL_VEINS.out.catch.ok.text=Você encurrala os ladrões sobre o saque e retoma cada lasca luminosa. Eles se rendem sem luta, sorrindo, e um deles sussurra que as veias avisaram que você viria — que o cristal fala com qualquer um que escute por tempo suficiente, e em breve falará com você também.
questdlg.GUARD_CRYSTAL_VEINS.out.catch.fail.win=Eles o ouvem chegar e se viram para lutar, mas você rompe o pequeno círculo deles e os prende sobre as lascas roubadas. Eles cedem sorrindo mesmo assim, um murmurando que as veias os tinham avisado de você — e que o cristal vai dar a sua palavra com o tempo, com você como com eles.
questdlg.GUARD_CRYSTAL_VEINS.out.catch.fail.lose=Eles escapulem o saque para o escuro e escapulem do seu alcance com ele, deixando você agarrando ecos e o seu próprio orgulho. A gruta zumbe baixinho enquanto você se retira, quase divertida, e por um instante você juraria que a luz moldou o seu nome.
questdlg.MAP_THE_GROTTO.intro=A gruta se contorce num labirinto de cristal espelhado.
questdlg.MAP_THE_GROTTO.opt.chart.label=Mapeá-la com cuidado
questdlg.MAP_THE_GROTTO.opt.chart.hint=DEX 14
questdlg.MAP_THE_GROTTO.out.chart.ok.text=Você mantém os nervos firmes por cada curva espelhada e traça o caminho até uma veia intocada. Mas os reflexos nunca acompanharam bem os seus movimentos — eles os respondiam, uma fração antes, como se algo atrás do vidro estivesse aprendendo o mapa de você enquanto você mapeava a casa dele.
questdlg.MAP_THE_GROTTO.out.chart.fail.win=Os espelhos o dobram para dentro de um ninho de rastejantes antes que você veja a curva, e você corta caminho de volta para fora faceta por faceta estilhaçante. Você alcança a veia intocada por fim, sem conseguir afastar a sensação de que os reflexos o conduziram à luta para ver como você se sairia.
questdlg.MAP_THE_GROTTO.out.chart.fail.lose=Você se perde entre os reflexos que respondem até não distinguir sua própria forma das doze que a imitam, e os rastejantes o encontram na confusão. Você cambaleia para fora pelo caminho que julga ter vindo, de mãos vazias, o escuro espelhado o soltando com o que quase parece curiosidade.
questdlg.MAP_THE_GROTTO.opt.push.label=Forçar passagem pelo que o bloqueia
questdlg.MAP_THE_GROTTO.out.push.win=Você põe o ombro e a lâmina em tudo o que a gruta atravessa no seu caminho e esmaga até a veia além. Cada lasca que você quebra ressoa numa única nota sustentada, a mesma nota, como se o labirinto inteiro fosse uma só voz e você apenas a tivesse interrompido em pleno pensamento.
questdlg.MAP_THE_GROTTO.out.push.lose=O labirinto vive mudando de ideia sobre onde ficam as paredes, e seus habitantes vêm de ângulos que não deveriam existir, até levarem a melhor sobre você. Você recua por corredores que se rearranjam às suas costas, certo agora de que a gruta não bloqueava seu caminho, mas decidia se o deixava passar.
questdlg.EXTRACT_GEODES.intro=Geodos enormes margeiam uma saliência sobre um abismo negro.
questdlg.EXTRACT_GEODES.opt.slow.label=Trabalhar a saliência devagar
questdlg.EXTRACT_GEODES.out.slow.text=Um trabalho paciente e cuidadoso enche sua mochila de geodos pesados e você nem uma vez olha para o abismo negro. O tempo todo um repique grave sobe do escuro abaixo da saliência — não o tinir do cristal golpeado, mas algo mais constante, uma voz sem boca, soletrando o seu nome para ver se serve.
questdlg.EXTRACT_GEODES.opt.pry.label=Arrancar o maior
questdlg.EXTRACT_GEODES.opt.pry.hint=STR 14
questdlg.EXTRACT_GEODES.out.pry.ok.text=Você firma as costas contra o grande geodo e o arranca — uma fortuna em cristal aninhada em seus braços. No instante em que ele se separa da saliência, uma palavra sem som se imprime no seu crânio, quase grata, e você percebe que o que acabou de levar nunca foi pedra, mas um pedaço de algo que queria ser carregado para fora.
questdlg.EXTRACT_GEODES.out.pry.fail.win=A saliência se lasca sob seu esforço e algo desperta no abismo negro lá embaixo — mas você se puxa de volta para a pedra firme e o afasta da borda até ele afundar. Você guarda seu prêmio e o equilíbrio, o repique sem som do escuro o seguindo para fora como uma pergunta pela metade.
questdlg.EXTRACT_GEODES.out.pry.fail.lose=A saliência cede quando o geodo se solta e você por pouco não o segue para dentro do abismo sem luz. Você se agarra à borda com dedos rasgados e se ergue sem nada, e enquanto foge o repique lá embaixo se molda no seu nome, sem pressa, certo de que você voltará para ouvir o resto.
questdlg.SEAL_THE_FISSURE.intro=Uma fenda vaza uma luz fria e zumbente — e formas se movem lá dentro.
questdlg.SEAL_THE_FISSURE.opt.wall.label=Emparedá-la
questdlg.SEAL_THE_FISSURE.out.wall.text=Você fecha a fenda zumbente atrás de um muro de pedra e argamassa e a luz fria se apaga. Pouco antes do último tijolo entrar, o zumbido se molda em palavras que só você ouve — calmas, certeiras, prometendo que um muro nada significa para um pensamento, e que ele simplesmente esperará dentro da sua cabeça.
questdlg.SEAL_THE_FISSURE.opt.cull.label=Abater o que rasteja para fora
questdlg.SEAL_THE_FISSURE.out.cull.win=Você se posta na boca fria da fenda e abate tudo o que rasteja para dentro da luz zumbente, até nada mais vir. O zumbido nunca vacila por todo o tempo, constante e indiferente à carnificina, como se apenas observasse suas mãos serem podadas e simplesmente fosse crescer mais.
questdlg.SEAL_THE_FISSURE.out.cull.lose=Vêm mais da luz fria do que lâmina alguma consegue conter, forma após forma o empurrando para fora da saliência. Você cede terreno e foge do escuro zumbente, e o som o segue túnel acima, calmo e regular, certo de que basta esperar você se esgotar.
questdlg.SEAL_THE_FISSURE.opt.seal.label=Ler a ressonância
questdlg.SEAL_THE_FISSURE.opt.seal.hint=LUCK 18
questdlg.SEAL_THE_FISSURE.out.seal.ok.text=Você ajusta o selo ao tom exato da fenda e a luz fria se dobra fechando-se sem um tremor. Para sintonizá-la você teve que escutar, escutar de verdade, e o zumbido está em você agora — uma segunda voz paciente sob seus pensamentos, muito satisfeita por você enfim entender a sua canção.
questdlg.SEAL_THE_FISSURE.out.seal.fail.win=Você avalia mal o tom e a ressonância chicoteia de volta, derramando as formas da fenda de uma só vez — mas você corta um caminho livre e rompe para a boca do túnel. O zumbido o deixa ir ressoando no seu crânio, não com raiva, só anotando onde ele termina e você começa.
questdlg.SEAL_THE_FISSURE.out.seal.fail.lose=O zumbido desliza sob seus pensamentos e os embaralha antes que você ache sua nota, e você se afasta cambaleando da fenda com a mente cheia de estática. Você consegue sair, mas um zunido fino e paciente se alojou atrás dos seus olhos, e você suspeita que já não seja inteiramente da gruta.
questdlg.CLEANSE_CRYSTAL_HORROR.intro=Um horror de cristal vivo se arrasta em direção à superfície.
questdlg.CLEANSE_CRYSTAL_HORROR.opt.shatter.label=Estilhaçá-lo
questdlg.CLEANSE_CRYSTAL_HORROR.out.shatter.win=Você enfrenta o horror rastejante de frente e o desfaz golpe a golpe ressoante num monte de cacos cintilantes. Mesmo estilhaçados os pedaços seguem zumbindo a mesma nota grave, todos em uníssono, e você recua antes de começar a imaginar se ele morreu de fato ou só se espalhou.
questdlg.CLEANSE_CRYSTAL_HORROR.out.shatter.lose=Suas facetas devolvem seus próprios golpes e seus cacos o abrem em uma dúzia de lugares antes que você possa se fechar. Você recua deixando-o meio quebrado e já se recompondo, o coro do seu zumbido subindo às suas costas, paciente e ininterrupto, como se nunca tivesse corrido perigo algum.
questdlg.CLEANSE_CRYSTAL_HORROR.opt.core.label=Achar seu núcleo fraturado
questdlg.CLEANSE_CRYSTAL_HORROR.opt.core.hint=DEX 18
questdlg.CLEANSE_CRYSTAL_HORROR.out.core.ok.win=Você lê as linhas de fratura até seu verdadeiro núcleo, golpeia uma vez, e o horror inteiro colapsa para dentro e fica escuro e silencioso. O súbito silêncio é pior que o ruído — um fôlego preso na rocha, como se o resto da gruta tivesse sentido a perda e estivesse decidindo o que fazer de você.
questdlg.CLEANSE_CRYSTAL_HORROR.out.core.ok.lose=O núcleo que você atingiu era um chamariz criado para atrair sua lâmina, e a massa real o engolfa enquanto você se recupera. Você se arranca e foge do cristal que se fecha, e o zumbido que ele nunca interrompeu sai com você, divertido, tendo aprendido exatamente como você caça.
questdlg.CLEANSE_CRYSTAL_HORROR.out.core.fail.win=Você não acha a falha, então quebra o horror do jeito longo e brutal, retalhando-o pedaço por pedaço teimoso. Ele tomba por fim, mas o esforço deixa a única nota dele ressoando nos seus dentes, e você não tem certeza de que o silêncio depois seja vazio.
questdlg.CLEANSE_CRYSTAL_HORROR.out.core.fail.lose=Ele se reconstitui mais rápido do que você consegue estilhaçar, cada caco que você solta voltando a fluir para a massa, até você entender que está perdendo e interromper. Você foge da coisa incansável túnel acima, seu zumbido jamais vacilando, certo agora de que nunca lutou contra uma criatura, mas contra uma mente que apenas veste uma.
questdlg.SLAY_CRYSTAL_BEAST.intro=A fera de cristal desperta, suas facetas em chamas.
questdlg.SLAY_CRYSTAL_BEAST.opt.slay.label=Abatê-la
questdlg.SLAY_CRYSTAL_BEAST.out.slay.win=Você avança através de suas facetas flamejantes e derruba a fera de cristal pedaço a pedaço cintilante até sua luz se apagar. Onde jaz quebrada, os cacos ainda repicam fracamente uns aos outros, passando algo adiante no escuro, e você não se demora para ouvir o que decidem.
questdlg.SLAY_CRYSTAL_BEAST.out.slay.lose=Seu fulgor queima a visão de você e suas garras de gume facetado fazem o resto, e a gruta se inclina para um branco zunindo. Você desperta caído contra a parede fria, cego e sangrando e derrotado, a fera sumida, seu zumbido grave agora entremeado na dor atrás dos seus olhos.
questdlg.SLAY_CRYSTAL_BEAST.opt.blind.label=Cegá-la com a própria luz
questdlg.SLAY_CRYSTAL_BEAST.opt.blind.hint=LUCK 22
questdlg.SLAY_CRYSTAL_BEAST.out.blind.ok.win=Você inclina um caco solto para capturar o próprio clarão dela e lança o fulgor de volta em suas facetas, e enquanto ela cambaleia ofuscada você a derruba. No silêncio depois, sua luz espalhada ainda tremula num ritmo fraco, como um pensamento tentando se concluir, e você sai antes que ele consiga.
questdlg.SLAY_CRYSTAL_BEAST.out.blind.ok.lose=A luz se dispersa errado do seu caco e queima os seus próprios olhos em vez dos dela, e a fera está sobre você antes que você possa piscar para clareá-los. Você foge meio cego por corredores que não consegue ver, seu zumbido triunfante iluminando o caminho que ela quer que você siga, mais fundo, não para fora.
questdlg.SLAY_CRYSTAL_BEAST.out.blind.fail.win=O truque esperto falha por completo, então você o joga de lado e enfrenta a fera flamejante nos termos dela, sobrevivendo à sua fúria golpe a golpe. Ela tomba escura por fim, e você fica ofegante na penumbra súbita, o silêncio zumbindo fraco nas bordas onde a luz costumava estar.
questdlg.SLAY_CRYSTAL_BEAST.out.blind.fail.lose=Ofuscado pela sua própria jogada, você perde a fera no clarão e ela o derruba antes que sua visão clareie. Você se arrasta para longe do fulgor dela sem nada conquistado, uma lasca da sua luz fria parecendo sair atrás dos seus olhos, paciente, já em casa ali.
questdlg.CLEANSE_THE_TIDES.intro=Uma imundície contamina os baixios sagrados.
questdlg.CLEANSE_THE_TIDES.opt.rite.label=Realizar o rito
questdlg.CLEANSE_THE_TIDES.opt.rite.hint=LUCK 10
questdlg.CLEANSE_THE_TIDES.out.rite.ok.text=Seu rito arranca a contaminação dos baixios e a água sagrada volta a correr clara e brilhante. Onde ela lambe seus tornozelos, cada corte e cada dor que você carregava se fecha e cessa — e a água límpida não larga seus pés, demorando-se morna contra a pele como se preferisse que você ficasse nela para sempre.
questdlg.CLEANSE_THE_TIDES.out.rite.fail.win=O rito vacila no meio da palavra e a imundície se reúne numa forma que avança — mas você a retalha nos baixios antes que possa se formar de todo. A água purificada se fecha morna em torno das suas feridas enquanto você fica ofegante, e você precisa sair depressa, antes que ela termine de remendá-lo até ficar.
questdlg.CLEANSE_THE_TIDES.out.rite.fail.lose=A contaminação se enrosca nas suas pernas e o arrasta para baixo antes que o rito pegue, e a água sagrada lhe enche a boca como um acolhimento. Você rompe a superfície tossindo na areia, poupado mas não livre — os baixios mansos o soltam devagar, a contragosto, do jeito que se desiste de algo que se pretendia guardar.
questdlg.CLEANSE_THE_TIDES.opt.drive.label=Expulsar o profanador
questdlg.CLEANSE_THE_TIDES.out.drive.win=Você avança e expulsa a coisa imunda debatendo-se dos baixios sagrados até a água correr limpa atrás dela. Os baixios curados lambem suas canelas o tempo todo, mornos e agarrados, fechando seus cortes tão rápido quanto a luta os abre, sem pressa de deixá-lo voltar à terra seca.
questdlg.CLEANSE_THE_TIDES.out.drive.lose=O profanador se torce por sua guarda e o puxa para baixo, para dentro do lodo, e a água abençoada se dobra sobre sua cabeça quase com carinho. Você se arrasta para a praia meio afogado e de mãos vazias, a maré buscando seus calcanhares em dedos mornos e lentos, pesarosa de vê-lo partir.
questdlg.BLESS_THE_SHALLOWS.intro=Peregrinos esperam que as águas sejam abençoadas, mas algo espreita ao largo.
questdlg.BLESS_THE_SHALLOWS.opt.bless.label=Abençoar as águas em paz
questdlg.BLESS_THE_SHALLOWS.out.bless.text=A bênção se assenta sobre os baixios e os peregrinos entram na água chorando de alegria, suas feridas e mancos sendo lavados. Nenhum deles quer voltar à praia, e quando você os chama eles apenas sorriem e derivam um pouco mais fundo, enquanto a água mansa se fecha em volta deles como um abraço que enfim achou o que segurava à espera.
questdlg.BLESS_THE_SHALLOWS.opt.clear.label=Eliminar primeiro o espreitador
questdlg.BLESS_THE_SHALLOWS.out.clear.win=Você avança para além dos peregrinos e expulsa o espreitador para a água funda, depois volta para abençoar a calmaria que comprou. Os baixios ficam claros e mornos em torno dos fiéis ajoelhados quando o rito pega, e nenhum deles se ergue para segui-lo para fora — só entram mais fundo, sorrindo, numa água que se fecha à volta deles como uma prece atendida.
questdlg.BLESS_THE_SHALLOWS.out.clear.lose=O espreitador o pega antes que você possa concluir o rito, arrastando-o para baixo, para o escuro onde os peregrinos não podem alcançá-lo. Você luta de volta à superfície e se arrasta para a praia exausto, a bênção por dizer, e os peregrinos observam da água com os olhos pacientes e sonhadores de quem já decidiu não voltar.
questdlg.BLESS_THE_SHALLOWS.opt.calm.label=Acalmá-los e ler a maré
questdlg.BLESS_THE_SHALLOWS.opt.calm.hint=LUCK 14
questdlg.BLESS_THE_SHALLOWS.out.calm.ok.text=Você lê a água e sincroniza o rito a uma maré branda e crescente; os peregrinos bendizem seu nome quando a cura toma forma. Mas a maré subiu disposta demais, inchando para encontrar suas palavras como algo ansioso por ser convidado a chegar mais perto — e agora ela repousa mais alto na areia do que tem direito, sem pressa de recuar.
questdlg.BLESS_THE_SHALLOWS.out.calm.fail.win=Você lê mal a maré e ela se torna imunda sob seus pés, o espreitador subindo com ela — mas você se põe entre ele e os peregrinos e o repele para a ondulação. A água da qual você os salvou lambe morna e grata as suas pernas, curando cada golpe que ela acerta, estranhamente relutante em deixar a luta, ou você, terminar.
questdlg.BLESS_THE_SHALLOWS.out.calm.fail.lose=A maré azeda, o pânico espalha os peregrinos, e o espreitador ataca em meio ao caos para arrastá-lo sob a água abençoada. Você se arrasta para fora sozinho e derrotado, o rito arruinado, e os baixios recuam da areia com uma lentidão relutante, como se tivessem contado com somá-lo à sua congregação quieta e sorridente.
questdlg.ESCORT_PILGRIMS.intro=Os peregrinos precisam cruzar a calçada submersa antes do anoitecer.
questdlg.ESCORT_PILGRIMS.opt.guide.label=Guiá-los até o outro lado
questdlg.ESCORT_PILGRIMS.opt.guide.hint=DEX 14
questdlg.ESCORT_PILGRIMS.out.guide.ok.text=Você lê as pedras seguras uma a uma e leva cada peregrino pela calçada submersa de pés secos. O mar se manteve baixo e quieto a travessia inteira, abrindo-se como um anfitrião que lhe deseja o bem — e só depois que o último peregrino pisou em terra a água tornou a cobrir o caminho, rápida e faminta, como se tivesse contado as cabeças e faltado uma.
questdlg.ESCORT_PILGRIMS.out.guide.fail.win=Um peregrino escorrega das pedras e as profundezas se agitam ao prová-lo — mas você puxa o desgarrado de volta e enfrenta o que quer que tenha subido ao splash até a travessia se completar. A água só se acalma quando todos os peregrinos estão em terra, recuando lenta e a contragosto, como se roubada de um dízimo que já julgava devido.
questdlg.ESCORT_PILGRIMS.out.guide.fail.lose=A calçada se inunda entre um passo e o seguinte, dispersando os que estão sob sua guarda para a rebentação enquanto formas frias se erguem à volta deles. Você arrasta o mais próximo para terra seca e perde o resto para o escuro, e o mar se fecha liso e satisfeito sobre o caminho, tendo feito sua contagem e o deixado, desta vez, fora da conta.
questdlg.ESCORT_PILGRIMS.opt.guard.label=Proteger a retaguarda contra as profundezas
questdlg.ESCORT_PILGRIMS.out.guard.win=Você se posta na retaguarda da coluna e mantém à distância as coisas pingando que sobem da estrada submersa até o último peregrino pisar em terra. As profundezas abrem mão da luta a contragosto, afundando sem um respingo, do jeito que um anfitrião tira a mesa de um convidado que não quis ficar.
questdlg.ESCORT_PILGRIMS.out.guard.lose=Algo se ergue da calçada submersa e leva os retardatários antes que você possa alcançá-los, e então quase leva você também. Você se arranca do aperto frio e cambaleia sozinho para terra seca, os peregrinos perdidos sumidos sob a água sem um grito, o mar já liso de novo e contando o que sobrou.
questdlg.PURIFY_THE_REEF.intro=O brilho do recife esmaeceu num cinza doentio.
questdlg.PURIFY_THE_REEF.opt.channel.label=Canalizar a bênção
questdlg.PURIFY_THE_REEF.opt.channel.hint=LUCK 14
questdlg.PURIFY_THE_REEF.out.channel.ok.text=Você verte a bênção no coral moribundo e a luz se espalha de volta pelo recife num lento desabrochar dourado. O brilho renovado se estende para além do recife e doura as suas próprias veias sob a pele, morno, acolhedor e errado — pois a mesma bênção que cura o recife é o que vaza para dentro do mundo, e agora um tanto dela vaza para dentro de você.
questdlg.PURIFY_THE_REEF.out.channel.fail.win=A bênção coalha em suas mãos e algo se iça para fora da podridão cinzenta, mas você o derruba antes que possa se firmar e termina a cura sobre sua ruína. A luz desabrocha de volta pelo recife e para dentro da sua própria pele enquanto isso, morna e errada, remendando-o quer você tenha pedido ou não.
questdlg.PURIFY_THE_REEF.out.channel.fail.lose=A podridão cinzenta sobe para encontrar a bênção coalhada e se apodera de você com ela, e por um instante a luz doentia e o seu próprio pulso batem como um só. Você se solta e foge do recife que esmaece de mãos vazias, um brilho frio e fraco alojado sob sua pele agora, vazando para dentro onde a ferida do mundo e a sua começaram a se confundir.
questdlg.PURIFY_THE_REEF.opt.burn.label=Queimar a podridão
questdlg.PURIFY_THE_REEF.out.burn.win=Você segue o mofo cinzento até seu coração contorcido e o extirpa na fonte até a água limpa correr pelo recife de novo. O brilho renovado se espalha rápido e ávido pelos seus braços enquanto você trabalha, curando as queimaduras que ele custa, e você precisa sair logo — antes que a cura decida que você é parte do recife que vale guardar.
questdlg.PURIFY_THE_REEF.out.burn.lose=A podridão revida, alastrando-se sobre suas mãos e braços acima mais rápido do que você consegue cortar, até precisar abandonar o recife para se salvar. Você sai pela água tremendo, o mofo recuando às suas costas quase com polidez, certo de que o vazamento que o alimenta tem todo o tempo de que precisa para alcançá-lo de novo.
questdlg.BANISH_THE_DROWNED.intro=Os afogados sobem das profundezas sagradas, pingando e silenciosos.
questdlg.BANISH_THE_DROWNED.opt.banish.label=Bani-los com o rito
questdlg.BANISH_THE_DROWNED.opt.banish.hint=LUCK 18
questdlg.BANISH_THE_DROWNED.out.banish.ok.text=Seu rito desfaz os mortos silenciosos e, um a um, eles afundam de volta sob a água abençoada para descansar. Ao mergulhar, cada um vira para você o rosto que pinga, não em ódio mas em acolhimento — pois as profundezas não os perdem, apenas os guardam, e o rito que os mandou para baixo foi a mesma água sagrada que os chamou para cima.
questdlg.BANISH_THE_DROWNED.out.banish.fail.win=O rito se desfaz na sua língua e os afogados silenciosos fecham o círculo à sua volta — mas você abre uma brecha com aço e sal e segura o terreno até eles afundarem. Eles descem sem pressa, os rostos pingando ainda virados a você em algo como acolhimento, sem dúvida de que a água sagrada simplesmente os chamará de novo.
questdlg.BANISH_THE_DROWNED.out.banish.fail.lose=O rito se estilhaça e mãos frias de morto se prendem a você e o puxam em direção às profundezas, a água abençoada subindo ávida até o seu queixo. Você se solta à beira e se arrasta para a praia engasgando, os afogados escapulindo de volta sob a superfície sem incômodo, pacientes como a maré sagrada que vive os erguendo.
questdlg.BANISH_THE_DROWNED.opt.force.label=Abatê-los pela força
questdlg.BANISH_THE_DROWNED.out.force.win=Você avança nas fileiras silenciosas dos afogados e os dispersa com aço e sal abençoado até a água sagrada repousar quieta de novo. Eles afundam sem protesto, os rostos se inclinando para você ao descer, pois a força só os manda de volta às profundezas que os guardam — e a mesma água sagrada vai entregá-los de novo.
questdlg.BANISH_THE_DROWNED.out.force.lose=Eles se erguem mais rápido do que você consegue derrubá-los, e para cada forma pingando que você dispersa duas mais escalam das profundezas abençoadas, até o número o empurrar para trás. Você recua pela praia exausto e cego de sal, os afogados se acomodando sob a água calma para esperar, certos, como a profundeza paciente é certa, da próxima vez.
questdlg.GUARD_SACRED_REEF.intro=Um leviatã das profundezas se enrosca ao redor do recife sagrado.
questdlg.GUARD_SACRED_REEF.opt.defend.label=Defender o recife
questdlg.GUARD_SACRED_REEF.out.defend.win=Você se posta no recife sagrado e enfrenta o leviatã anel por anel até ele abrir mão do seu domínio e deslizar de volta ao abismo. A água abençoada à sua volta cura suas feridas enquanto sustenta a coisa que você combateu, e você sobe para fora depressa, antes que o dom do recife decida que você também pertence às profundezas.
questdlg.GUARD_SACRED_REEF.out.defend.lose=Os anéis do leviatã se fecham em torno do recife e de você com ele, e os baixios sagrados correm vermelhos antes que você se arranque. Você dá às rochas quebrado e ofegante, a fera recuada mas não ida, a profundeza sagrada que a gerou lambendo morna suas feridas como se preferisse que você ficasse.
questdlg.GUARD_SACRED_REEF.opt.sing.label=Cantar o verso antigo para embalá-lo
questdlg.GUARD_SACRED_REEF.opt.sing.hint=LUCK 22
questdlg.GUARD_SACRED_REEF.out.sing.ok.win=O verso antigo se assenta sobre o leviatã e seus anéis afrouxam enquanto ele afunda em algo como sono — e você crava sua lâmina enquanto ele sonha. Ele morre lento e sem resistir, deslizando de volta para a profundeza abençoada que o fez, e a água morna lambe atrás de você rochas acima, sem querer deixar seu cantor partir.
questdlg.GUARD_SACRED_REEF.out.sing.ok.lose=O verso se quebra numa nota errada e desperta o leviatã para a fúria plena, seus anéis açoitando o recife em espuma à sua volta. Você mergulha para fora e foge pela água ensanguentada, a fera bramindo às suas costas, a profundeza sagrada a impelindo como um mar que defende os seus.
questdlg.GUARD_SACRED_REEF.out.sing.fail.win=Sua voz vacila e o verso não consegue prendê-lo, então você enfrenta o leviatã desperto com aço em vez disso e sobrevive à sua fúria lenta e vasta. Ele afunda por fim no abismo que o gerou, e a água abençoada se agarra morna à sua pele enquanto você sai, relutante em devolvê-lo ao ar.
questdlg.GUARD_SACRED_REEF.out.sing.fail.lose=Seu canto vacila e a própria profundeza parece afogá-lo, o leviatã surgindo através do verso quebrado para quase levá-lo junto. Você é arrastado para baixo e cuspido de volta por uma ondulação que não sabe explicar, dando ao recife vivo, o mar sagrado poupando seu cantor por uma canção ainda inacabada.
questdlg.RESCUE_STRAY_DOG.out.help.owned=Você ajuda a pequena vira-lata. Ela já está em segurança ao seu lado.
questdlg.RESCUE_STRAY_DOG.out.help.got=Você cuida da cadela doente noite adentro. Ao amanhecer ela está de pé, o rabo abanando — e não larga mais do seu lado. 🐶 Luna agora é sua companheira!
questdlg.RESCUE_STRAY_DOG.out.help.nopet=Você cuida da cadela doente até ela recuperar a saúde. Ela lambe sua mão agradecida e sai trotando rumo à natureza. (A chance de vínculo era {0})
# [LUNA_INTERRUPT]
luna.interrupt.intro=No meio do caminho, uma cadela vira-lata trêmula cruza a sua frente, ganindo. Ela ergue os olhos cansados e esperançosos para você.
luna.interrupt.help.nopet=Você acalma a vira-lata trêmula até ela parar de tremer. Ela esfrega o focinho na sua mão e lambe seus dedos — ela está começando a gostar de você. (A chance de vínculo era {0})

# ══════════════════════════════════════════════════════════════════════════════
# P3 — Torre: atmosfera dos 50 andares (tower.floor.<n>.atmosphere) + escolha do Arka (tower.arka.*)
# Nomes de monstro/MVP (combatentes) ficam pra P7 junto dos battle logs (consistência).
# ══════════════════════════════════════════════════════════════════════════════
tower.floor.1.atmosphere=O primeiro salão é frio para um lugar tão alto. O ar não desce das janelas — ele sobe, de uma fenda no chão, com cheiro de maré e terra profunda. Há uma marca redonda na pedra que o Rei mandou cobrir. Foi sua primeira ordem.
tower.floor.2.atmosphere=Lanças repousam em suportes que mão nenhuma tocou há anos. Uma delas ainda está quente.
tower.floor.3.atmosphere=As tochas ardem com uma chama pálida e baixa que não dá calor, e sua sombra cai para o lado errado.
tower.floor.4.atmosphere=Uma sala da guarda: dados ainda sobre a mesa, cadeiras afastadas, como se todos tivessem se levantado de uma vez e subido.
tower.floor.5.atmosphere=Estandartes da Coroa de Arka apodrecem nas paredes, a coroa bordada já enegrecida.
tower.floor.6.atmosphere=A escada se estreita. Marcas de mãos sobem a parede ao seu lado — dedos demais em cada uma.
tower.floor.7.atmosphere=Uma capela para nenhum deus que você conheça. As velas choram cera que se acumula e rasteja em direção à escada acima.
tower.floor.8.atmosphere=Os mortos aqui vestem as cores da guarnição e te saúdam quando você passa — então estendem a mão para suas lâminas.
tower.floor.9.atmosphere=O último salão antes do portão superior fede a sangue velho e ferrugem nova. Algo grande respirou aqui, há pouco.
tower.floor.10.atmosphere=Ele defendeu este salão até o fim, e não lhe foi permitido morrer. Sua espada ainda está erguida. Seus olhos te seguem — e imploram. Ele teve um nome, um dia — Sor Bramm Holt, Capitão do Portão.
tower.floor.11.atmosphere=Folhas de ouro descascam das paredes em lâminas. O chão é forrado de moedas que ninguém se curvou para juntar.
tower.floor.12.atmosphere=Espelhos forram a galeria. Em cada um deles, seu reflexo está um batimento atrasado.
tower.floor.13.atmosphere=Retratos de nobres, cada rosto pintado riscado — todos, exceto os olhos.
tower.floor.14.atmosphere=Um banquete há muito estragado, os convidados ainda sentados, ainda mastigando.
tower.floor.15.atmosphere=Perfume espesso o bastante para sufocar, sobreposto a algo mais doce e muito pior por baixo.
tower.floor.16.atmosphere=A antecâmara da sala do trono. Suplicantes ajoelharam aqui por tanto tempo que seus joelhos se fundiram à pedra.
tower.floor.17.atmosphere=Uma casa de contas: livros-razão empilhados até o teto, cada página com o mesmo nome, escrito mil vezes.
tower.floor.18.atmosphere=Joias brotam das paredes como mofo. Elas se viram para te seguir, do jeito que olhos fazem.
tower.floor.19.atmosphere=O campeão de armas da corte, que nunca perdeu um duelo e nunca lutou um de verdade.
tower.floor.20.atmosphere=Ele contava seu ouro enquanto a cidade queimava. A podridão o encontrou cheio — e o deixou mais cheio ainda. Ele te oferece um preço para voltar atrás. Ele não consegue entender que você não vai aceitar. Seu nome era Lorde Casnar Vane, o Tesoureiro da Coroa.
tower.floor.21.atmosphere=Abaixo da corte a pedra é morna. Os degraus estão molhados, e o molhado é vermelho, e ele flui para cima ao seu encontro.
tower.floor.22.atmosphere=Os incensários balançam sozinhos, exalando uma fumaça com gosto de cobre e preces antigas.
tower.floor.23.atmosphere=Um círculo entalhado no chão, esfregado e recortado uma centena de vezes. Os sulcos descem fundo o bastante para afogar alguém.
tower.floor.24.atmosphere=Os fiéis ajoelham-se voltados para baixo, repetindo uma palavra com um formato de boca que você não consegue fazer.
tower.floor.25.atmosphere=Cristais brotam dos altares, vermelhos no cerne. Um deles pulsa no ritmo do seu coração.
tower.floor.26.atmosphere=Frascos de sangue real forram cada prateleira, cada um rotulado com uma data. O último é o de hoje.
tower.floor.27.atmosphere=Algo nasceu aqui e não sobreviveu ao parto. E ainda está tentando.
tower.floor.28.atmosphere=O altar mais profundo. O sangue não se empoça — ele escala as paredes, contra a inclinação, em direção aos andares acima.
tower.floor.29.atmosphere=Uma cadeira em forma de trono, feita de osso e ouro: um assento de ensaio. Quem sentou aqui treinava ser rei.
tower.floor.30.atmosphere=Ela veste a forma do Rei, seu andar, sua voz — um ensaio oco para a coisa lá no topo. Ela te saúda pelo nome, na voz do Rei, e pergunta por que você veio tão longe para matar um homem que foi enviado para salvar. Não tem nome próprio — só o dele.
tower.floor.31.atmosphere=A luz aqui agora vem de baixo, do tom errado de pálido, e não projeta sombra alguma.
tower.floor.32.atmosphere=As paredes inspiram. O ar morno passa por você, para baixo, sempre para baixo.
tower.floor.33.atmosphere=Coisas dragadas de algum lugar mais profundo, vestindo pedra e ouro como uma pele que não serve.
tower.floor.34.atmosphere=O gabinete do Rei. Suas anotações cobrem cada superfície, numa caligrafia que se torna menos humana a cada página.
tower.floor.35.atmosphere=Um zoológico dos transformados — cortesãos, guardas, sacerdotes — todos derretendo em direção a uma única forma que você não consegue nomear.
tower.floor.36.atmosphere=Um sussurro, numa voz quase como a do Rei, te promete a coisa que você mais deseja, e te chama pelo seu próprio nome.
tower.floor.37.atmosphere=O ar vibra, grave e constante — um batimento cardíaco grande demais para pertencer a qualquer coisa que devesse viver.
tower.floor.38.atmosphere=Os últimos da guarda fiel do Rei, que o seguiram para baixo e não puderam segui-lo até o fim.
tower.floor.39.atmosphere=Uma porta chamuscada por dentro. Algo tentou manter a si mesmo trancado lá dentro. Falhou.
tower.floor.40.atmosphere=O homem que o mar cuspiu de volta, anos atrás, declarado morto e retornado errado. Ele não levanta a mão contra você. Apenas ri, e te convida a subir. "Dê ao pobre rei a sua paz", ele diz. "É tudo que eu sempre quis." Chamavam-no Oren, o Afogado — o homem que acendeu o rito.
tower.floor.41.atmosphere=Passado o Xamã, a torre deixa de ser uma torre. As escadas continuam; as paredes se esquecem de continuar.
tower.floor.42.atmosphere=Você não consegue mais distinguir o que é em cima do que é embaixo. A vibração já está nos seus dentes.
tower.floor.43.atmosphere=Formas que são quase pessoas, quase feras, quase nada — ainda decidindo o que ser.
tower.floor.44.atmosphere=O chão é morno como pele e cede como um fôlego preso. Lá no fundo, algo imenso se revira no sono.
tower.floor.45.atmosphere=Sangue real, fresco, corre escada ACIMA passando por você, ávido, em direção ao topo.
tower.floor.46.atmosphere=Um trono feito dos antigos estandartes do Rei, queimados e reconstruídos, queimados e reconstruídos.
tower.floor.47.atmosphere=Os sussurros cessam. O silêncio é pior — ele está ouvindo de volta.
tower.floor.48.atmosphere=Um reflexo seu sobe ao seu lado, um degrau atrás, sorrindo.
tower.floor.49.atmosphere=A última porta. Luz vaza por baixo dela, da cor de uma ferida. Além dela, você ouve um homem chorando.
tower.floor.50.atmosphere=Rei Arka, envolto numa luz que não é sua — e por baixo dela, por um lampejo, o homem que fundou um reino. Ele luta para ascender; não entende que é apenas uma chave. Quando cair, ele vai implorar. Arka, o Fundador — o homem sob a chave.
tower.arka.spare=Você abaixa sua lâmina. O Rei Arka te agradece — e crava a adaga ritual no próprio coração, sobre a marca no chão. "Coisas piores estão por vir", ele sussurra. O chão se abre sob seus pés.
tower.arka.kill=Você desfere o golpe. O sangue do Rei se espalha pela marca, e o chão cede sob seus pés. Lá embaixo, bem ao longe, algo começa a despertar.

