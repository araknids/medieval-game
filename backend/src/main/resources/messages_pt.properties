kingdom.FISHING.name=Garganta de Osso
kingdom.FISHING.lore=Uma garganta afogada onde a maré dá mais do que qualquer rede deveria suportar — e devolve mais do que os vivos. Pesque aqui tempo o bastante e você aprende a não olhar de perto demais para o que pegou.
kingdom.MINING.name=Minas de Ferro Negro
kingdom.MINING.lore=Quanto mais fundo o poço, mais rica a veia — e mais quente a pedra. Os mineiros antigos dizem que a montanha tem pulso. Os novos aprendem a não comentar.
kingdom.COMBAT.name=Fortaleza Maldita
kingdom.COMBAT.lore=A velha fortaleza à sombra da Torre, onde a corrupção é mais densa. Os soldados enviados para segurar a linha voltaram — mas voltaram errados.
kingdom.GRUTAS_DE_CRISTAL.name=Grutas de Cristal
kingdom.GRUTAS_DE_CRISTAL.lore=Cavernas onde as gemas crescem como geada, belas além da razão. Garimpeiros que se demoram demais param de cavar — e começam a escutar.
kingdom.MAR_ABENCOADO.name=Mar Abençoado
kingdom.MAR_ABENCOADO.lore=Águas sagradas onde os peixes restauram a vida de quem os come. Ninguém pergunta como um mar frio como a morte aprendeu a curar. Os afogados aqui não descansam — eles se esticam para as profundezas.

