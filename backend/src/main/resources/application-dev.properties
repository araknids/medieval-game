# [WORK_EXPLOIT_FIX] Bypassa a ESTAMINA p/ facilitar testes (não há mais timers de missão/arena a zerar;
# o timer do Trabalho é SEMPRE real). Em prod pode estar ligado de propósito (teste solo).
app.dev.instant-complete=true

# [LAUNCH_HARDENING] Throttle global da API desligado em dev/teste (é proteção de prod público; ligado
# aqui só atrapalharia o dev local e o teste que cria muitas contas). Em prod fica ON (default true).
app.ratelimit.enabled=false

# Email desabilitado em dev — token de reset aparece no console
app.mail.enabled=false
app.base-url=http://localhost:8080

# Usuário admin criado automaticamente no startup (só no perfil dev)
app.dev.admin.username=adm
app.dev.admin.password=adm123
app.dev.admin.warrior-name=Guerreiro ADM

# Banco H2 em memória - roda sem instalar nada, perfeito para desenvolvimento
spring.datasource.url=jdbc:h2:mem:medievaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console H2 acessível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
