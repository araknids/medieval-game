spring.application.name=medieval-game

# Perfil ativo: use "dev" para rodar local, "prod" para servidor
spring.profiles.active=dev

# open-in-view=false em TODOS os perfis (não só prod) para que dev/test reproduzam
# o comportamento de produção e peguem acessos lazy fora de @Transactional. [AUDITORIA A2]
spring.jpa.open-in-view=false

# Cache-busting do frontend: o app.js/style.css/index.html têm nomes fixos (sem hash), então
# sem isto o navegador cacheava versões antigas e "sumia" features novas após deploy. no-cache faz
# o browser SEMPRE revalidar (ETag/Last-Modified → 304 se igual, 200 com o novo se mudou). [CACHE_BUST]
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# JWT secret (mude para algo longo e aleatório em produção)
# Em dev usa o valor padrão. Em prod, define JWT_SECRET como variável de ambiente no Railway
app.jwt.secret=${JWT_SECRET:chave_local_dev_nao_usar_em_producao}

# [SERVIDORES] Identidade do servidor/realm (deploys separados). Cada deploy seta SERVER_* no Railway.
# env: dev | test | prod (só rótulo/cor na UI). Exposto em GET /api/server-info (público).
app.server.id=${SERVER_ID:local}
app.server.name=${SERVER_NAME:Local Dev}
app.server.env=${SERVER_ENV:dev}

# [DISTRIB_UPDATE] Trava de versão do cliente Godot (exposta no /api/server-info).
# Ao publicar um cliente novo, suba latest-version; só suba min-version quando quiser FORÇAR a
# atualização (clientes abaixo disso são bloqueados). 0.0.0 = sem trava (default p/ dev).
app.client.min-version=${CLIENT_MIN_VERSION:0.0.0}
app.client.latest-version=${CLIENT_LATEST_VERSION:0.0.0}
app.client.download-url=${CLIENT_DOWNLOAD_URL:}

# CORS - origens permitidas (adicione o endereço do seu servidor Godot)
app.cors.allowed-origins=http://localhost:8080,http://localhost:3000

# Reinos contestáveis por guild-war (Reinos V2). Os demais reinos são zonas abertas.
# Começa com os 3 reinos clássicos; para liberar guerra em mais reinos, edite a lista
# (ou defina APP_KINGDOMS_WAR_TERRITORIES no Railway).
app.kingdoms.war-territories=${APP_KINGDOMS_WAR_TERRITORIES:FISHING,MINING,COMBAT}

# [MERCADO_STEAM] Mercador Azul / Steam Inventory Service. Desligado até o jogo ter appid na Steam +
# cliente Godot. Com enabled=false o SteamMarketProvider é o stub (não chama a Steam). A publisher key
# (asset server key) NUNCA vai no front — só backend/env. Ver docs/PLANO_MERCADO_STEAM.md.
app.steam.enabled=${STEAM_ENABLED:false}
app.steam.appid=${STEAM_APPID:0}
app.steam.publisher-key=${STEAM_PUBLISHER_KEY:}
app.steam.market-fee-pct=${STEAM_MARKET_FEE_PCT:10}
