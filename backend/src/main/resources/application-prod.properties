app.dev.instant-complete=false

# PostgreSQL com variáveis individuais (mais confiável que DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de conexões — ajustado para o limite do Railway. [AUDITORIA_2 A8] configurável: ao subir o plano
# do Postgres no Railway, aumentar DB_POOL_SIZE (cada request faz ~6-7 queries seguras e segura 1 conexão).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
# [LAUNCH_HARDENING] timeout CURTO: sob flood, a thread falha rápido (503) em vez de ficar 20s presa
# esperando conexão e empilhando — o que estende a exaustão do pool a todo o app. leak-detection avisa
# (e devolve) conexão segurada por um @Transactional travado. Pool 5-10 já serve milhares de req leves
# (regra HikariCP (cores*2)+1); subir só ao escalar o Postgres.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# [LAUNCH_HARDENING] Tomcat dimensionado p/ instância pequena do Railway — os defaults do Boot (200
# threads / 8192 conexões) deixam o box aceitar muito mais socket/thread do que consegue servir, o que
# vira exaustão de memória/FD sob slowloris ou burst. Alinhe as threads a um múltiplo pequeno do pool.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=15000
# Cap de corpo (defesa em profundidade junto do ApiRateLimitFilter, que corta /api/** antes do parse).
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=256KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# [LAUNCH_HARDENING] Throttle global da API (ApiRateLimitFilter): 60 req / 10s por jogador (ou por IP).
# Folgado p/ o fan-out de uma tela; instantâneo p/ um loop de flood. Ajustável por env sem deploy.
app.ratelimit.enabled=${API_RATE_ENABLED:true}
app.ratelimit.max-requests=${API_RATE_MAX:60}
app.ratelimit.window-ms=${API_RATE_WINDOW_MS:10000}
app.ratelimit.max-body-bytes=${API_RATE_MAX_BODY:65536}

# [LAUNCH_HARDENING] Token JWT mais curto em prod (24h) — janela menor p/ token roubado. Override por env.
# (O default do código é 168h p/ dev; revogação só acontece no reset de senha.)
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# CORS restrito à origem do web app (sobrescreva com APP_CORS_ALLOWED_ORIGINS, separado por vírgula).
# O cliente Godot é nativo (não envia Origin), então CORS não o afeta. [AUDITORIA M11]
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://medieval-game-production.up.railway.app}

# Email via Brevo (brevo.com) — usa HTTP API, sem bloqueio SMTP
app.mail.enabled=${MAIL_ENABLED:false}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.from-email=${BREVO_FROM_EMAIL:}
app.base-url=${APP_BASE_URL:https://medieval-game-production.up.railway.app}
