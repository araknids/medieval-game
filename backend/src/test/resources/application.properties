# Perfil de testes — H2 in-memory, sem email, instant-complete
spring.profiles.active=dev

# Garante que o bean JavaMailSender seja criado sem erro
spring.mail.host=localhost
spring.mail.port=25

# Propriedades do main/application.properties que ficam ausentes durante testes
app.jwt.secret=test-secret-key-for-integration-tests-only-32chars
app.cors.allowed-origins=http://localhost:8080
app.mail.enabled=false
app.base-url=http://localhost:8080

# [ZONA_CHEFE] chefe errante OFF nos testes → collect determinístico (testado direto via resolveBoss*)
app.zone.boss-enabled=false

# [LUNA_INTERRUPT] interrupção da Luna OFF nos testes → collect determinístico (testado direto via resolveLuna*)
app.luna.interrupt-enabled=false

# [INCURSAO] armadilha de baú OFF nos testes → TREASURE determinístico (só loot, sem mini-luta)
app.expedition.trap-enabled=false

# [PVP_FLAG] gatilho de raid PvP OFF nos testes → collect determinístico (o saque é testado direto via raidForTest)
app.expedition.pvp-raid-enabled=false
