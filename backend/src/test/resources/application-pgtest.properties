# [TESTE_POSTGRES] Perfil de teste no Postgres REAL via Testcontainers (`mvn test -Ppostgres`).
# A URL jdbc:tc: faz o Testcontainers subir um container postgres:16 quando o driver conecta —
# precisa do Docker LIGADO. Espelha o perfil dev (instant-complete, admin seed, ddl) mas no Postgres,
# pra validar o que o H2 não pega (SchemaMigrator com DO $$, check-constraints de enum, índices).
# O `mvn test` padrão (sem -Ppostgres) continua em H2 e não toca nisso.

spring.datasource.url=jdbc:tc:postgresql:16:///medieval
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Espelha os flags do perfil dev (que NÃO carrega quando o ativo é pgtest)
app.dev.instant-complete=true
app.dev.admin.username=adm
app.dev.admin.password=adm123
app.dev.admin.warrior-name=Guerreiro ADM
