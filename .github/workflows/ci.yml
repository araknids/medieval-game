name: CI — Testes Automáticos

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Rodar todos os testes
        working-directory: backend
        run: mvn test --batch-mode
        env:
          # Variáveis mínimas para o contexto de teste
          # O perfil dev usa H2 em memória, não precisa de PostgreSQL
          SPRING_PROFILES_ACTIVE: dev

      - name: Publicar relatório de testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  # [TESTE_POSTGRES] roda a MESMA suíte no Postgres real (Testcontainers) — pega o que o H2 não pega
  # (SchemaMigrator com DO $$, check-constraints de enum, índices). O runner do GitHub já tem Docker.
  test-postgres:
    name: Tests on PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Rodar todos os testes no Postgres
        working-directory: backend
        run: mvn test -Ppostgres --batch-mode

      - name: Publicar relatório de testes (Postgres)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit (Postgres)
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
