# [BACKUP_DB] Backup diário do Postgres de produção (portátil; ver docs/PLANO_BACKUP_BANCO.md).
# pg_dump -> gpg AES-256 -> bucket S3 privado. Host-agnóstico: só precisa do PROD_DATABASE_URL alcançável.
# Enquanto os secrets não estiverem setados, o job PULA sem falhar (não fica spammando erro).
name: db-backup

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC todo dia
  workflow_dispatch: {}    # botão "Run workflow" (manual/teste)

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pular se os secrets não estão configurados
        id: guard
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL não configurado — pulando (configure os secrets: ver docs/PLANO_BACKUP_BANCO.md §6)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar postgresql-client (pgdg)
        if: steps.guard.outputs.skip == 'false'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16   # ⚠️ casar com a major version do servidor

      - name: Rodar backup
        if: steps.guard.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX || 'prod' }}
        run: bash scripts/backup/db_backup.sh "$(date -u +%Y%m%dT%H%M%SZ)"
